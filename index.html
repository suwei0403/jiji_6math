/* 畫面上的播報條（沒有語音的裝置也看得到） */
function ticker(text, cls){
  var box=document.getElementById('rankTicker');
  if(!box) return;
  box.className='ticker '+(cls||'');
  box.innerHTML=(cls==='up'?'🚀 ':cls==='down'?'⚠️ ':'📣 ')+esc(text);
  box.style.display='';
}

/* 比對上一次的名次，找出這次的變動，並播報「誰、為什麼、變成第幾名」
   ------------------------------------------------------------------
   RANK_SNAP[uid] = { r:名次, g:總得分, d:完成關數, f:是否交卷 } */
function syncRanks(list, selfOnly){
  var sorted=list.slice().sort(rankSort), now={}, evts=[];
  RANK_DELTA={};
  sorted.forEach(function(r,i){
    now[r.uid]={ r:i+1, g:r.gained||0, d:r.done||0, f:r.fin?1:0 };
  });

  if(RANK_SNAP){
    var byOldRank={}, nameOf={};
    for(var u in RANK_SNAP) byOldRank[RANK_SNAP[u].r]=u;
    sorted.forEach(function(r){ nameOf[r.uid]=(r.uid===UID?'你':r.name); });

    sorted.forEach(function(r,i){
      var o=RANK_SNAP[r.uid], nn=i+1, me=(r.uid===UID), who=me?'你':r.name;
      if(!o){
        if(r.done>0) evts.push({p:2, cls:'', t:who+'上榜了，排在第 '+nn+' 名', nm:[r.name]});
        return;
      }
      RANK_DELTA[r.uid]=o.r-nn;

      /* 這一次為什麼會動：加了幾分、破了第幾關、還是交卷了 */
      var dg=(r.gained||0)-o.g, dd=(r.done||0)-o.d, cause='';
      if(dg>0) cause = who+'加了 '+fmtPt(dg)+' 分';
      if(dd>0) cause = cause ? (cause+'、破了第 '+r.done+' 關')
                             : (who+'破了第 '+r.done+' 關');
      if(r.fin && !o.f) cause = who+'交卷了';

      if(nn<o.r){
        var pu=byOldRank[nn], passed=(pu&&pu!==r.uid)?nameOf[pu]:'';
        var tail = (nn===1) ? (me?'衝上第一名了！':'衝上第一名！')
                 : passed   ? ('超過'+passed+'，'+(me?'衝上':'來到')+'第 '+nn+' 名')
                            : ('前進 '+(o.r-nn)+' 名，'+(me?'衝上':'來到')+'第 '+nn+' 名');
        evts.push({p: me?7:(nn===1?5:4), cls:'up', t:(cause? cause+'，':who)+tail, nm:[r.name, passed]});
      }else if(nn>o.r){
        if(me){
          var by='';
          for(var k=0;k<sorted.length;k++){
            var s2=sorted[k], os=RANK_SNAP[s2.uid];
            /* 新上榜（舊名單裡沒有）又排到你前面的人，也算是超過你的人 */
            if(s2.uid!==UID && (!os || os.r>o.r) && (k+1)<nn){ by=s2.name; break; }
          }
          var bg = by ? (function(){
            for(var m=0;m<sorted.length;m++){
              if(sorted[m].name===by){
                var d2=(sorted[m].gained||0)-(RANK_SNAP[sorted[m].uid]||{g:0}).g;
                return d2>0 ? (by+'加了 '+d2+' 分，超過你了') : (by+'超過你了');
              }
            }
            return by+'超過你了';
          })() : '你被超過了';
          evts.push({p:8, cls:'down', t: bg+'，你掉到第 '+nn+' 名', nm:[by]});
        }
      }else if(cause){
        /* 名次沒變，但分數動了也要說一聲，排行榜才不會無聲跳動 */
        evts.push({p: me?3:1, cls:'', t: cause+'，還是第 '+nn+' 名', nm:[r.name]});
      }
    });
  }
  RANK_SNAP=now;

  if(!evts.length) return false;
  evts.sort(function(a,b){ return b.p-a.p; });
  if(selfOnly) evts=evts.filter(function(e){ return e.t.indexOf('你')>=0; });
  if(!evts.length) return false;

  ticker(evts[0].t, evts[0].cls);
  for(var i=0;i<evts.length && i<3; i++) say(evts[i].t, i>0, evts[i].nm);
  if(evts[0].cls==='up' && evts[0].t.indexOf('你')===0) confetti();
  return true;
}

/* 追趕提示：離前一名還差多少（html 給畫面、speak 給語音） */
function chaseInfo(list){
  var sorted=list.slice().sort(rankSort), me=-1;
  for(var i=0;i<sorted.length;i++){ if(sorted[i].uid===UID){ me=i; break; } }
  if(me<0) return {html:'', speak:''};
  if(me===0){
    if(sorted.length<2) return {html:'', speak:''};
    var gap=fmtPt(sorted[0].gained-sorted[1].gained);
    return {
      html:'<div class="chase lead">👑 你是第 1 名，領先第 2 名 <b>'+gap+'</b> 分——別被追上了！</div>',
      speak:'你是第 1 名，領先第 2 名 '+gap+' 分，別被追上了。'
    };
  }
  var up=sorted[me-1], diff=up.gained-sorted[me].gained, diffT=fmtPt(diff);
  if(diff<=0) return {
    html:'<div class="chase">⚡ 你和第 '+(me)+' 名同分，<b>用時比較短就能超過</b>！</div>',
    speak:'你和第 '+me+' 名同分，用時比較短就能超過。'
  };
  return {
    html:'<div class="chase">🔥 再拿 <b>'+diffT+'</b> 分就能超過 '+esc(up.name)+'，衝上第 '+me+' 名！</div>',
    speak:'再拿 '+diffT+' 分就能超過 '+speakName(up.name)+'，衝上第 '+me+' 名。'
  };
}

function boardOff(){
  if(BOARD_OFF){ try{BOARD_OFF();}catch(e){} BOARD_OFF=null; }
  LAST_CHASE='';                 /* 下次打開排行榜會重新唸一次目前處境 */

  SAY_Q.length=0; SAY_BUSY=false;
}
function encodeRec(r){ try{ return UNIT.codePrefix+btoa(unescape(encodeURIComponent(JSON.stringify(r)))); }catch(e){ return ''; } }
function decodeRec(code){
  try{
    code=(code||'').trim().replace(new RegExp('^'+UNIT.codePrefix),'');
    var r=JSON.parse(decodeURIComponent(escape(atob(code))));
    if(r&&r.uid&&typeof r.perf==='number') return r;
  }catch(e){}
  return null;
}
var BOARD_MSG=null, LAST_LIST=[], EXPORT_SORT='rank', EXPORT_TITLE='';
function seatNo(name){
  var t=String(name||''), m=t.match(/(\d+)\s*號/);
  if(m) return parseInt(m[1],10);
  var all=t.match(/\d+/g);
  if(all&&all.length) return parseInt(all[all.length-1],10);
  return 9999;
}

                      :'<div class="meta" style="color:#c0392b">● 還沒挑戰</div>'))

  }).join('');
  app.innerHTML =
    '<div class="fac-head"><div class="emoji">'+pet().f+UNIT.emoji+'</div><h2>'+UNIT.title+'</h2>'
    + '<p style="font-weight:800;color:var(--brandink);font-size:16px">'+UNIT.role+'：'+esc(S.name||UNIT.roleAnon)+'</p>'
    + '<p>'+UNIT.intro+'</p>'
    + '<div class="progline">📋 我的進度：完成 <b>'+playedCount+' / '+LEVELS.length+'</b> 關'
    + '　·　總共玩了 <b>'+playTimes+'</b> 次'
    + '<span id="progEst">'+progEstHTML()+'</span></div></div>'
    + '<div class="goal"><b>🎯 這一站要學會：</b>'+UNIT.goal+'</div>'
    + '<div class="levels">'+cards+'</div>'
    + '<div class="bonus">📸 <b>加分任務：</b>'+UNIT.bonus+'</div>'
    + (S.finalized
        ? '<div class="finalbar">🔒 <b>成績已經送出了</b><br>'
          + '這個帳號以目前的分數為準，'+(HUNDRED?'每一關':'四關')+'都已鎖住，不能再遊玩。'
          + '<div style="margin-top:8px;font-size:13.5px;color:#8b7a55">'
          + '要重玩請找老師解鎖。</div></div>'
        : '')
    + '<div class="actions" style="margin-top:18px">'
    + (allDone?'<button class="btn go" id="report">🏅 看'+UNIT.certName+'</button>':'')
    + '<button class="btn main" id="board">🏆 排行榜</button>'
    + (!S.finalized?'<button class="btn stop" id="stopAll">⏹ 結束並送出成績</button>':'')
    + (!S.finalized?'<button class="btn ghost" id="chpet">✏️ 改名字／換'+(UNIT.petWord||'夥伴')+'</button>':'')

    + (!S.finalized&&playedCount>0?'<button class="btn ghost" id="reset">重新開始</button>':'')
    + (S.finalized?'<button class="btn ghost" id="unlock">👩‍🏫 老師解鎖</button>':'')
    + '</div>';
  Array.prototype.forEach.call(app.querySelectorAll('.lv'),function(el){
    el.onclick=function(){
      if(el.classList.contains('locked')){
        sWrong();
        var i=+el.dataset.i, prev=i>0?LEVELS[i-1]:null;
        alertBar(S.finalized ? '成績已經送出了，不能再遊玩。'
                 : LEVELS[i].wip ? '這一關還在製作中。'
                 : '要先完成 '+prev.id+' '+prev.name+' 才會解鎖這一關。');

      }

  if(r) r.onclick=function(){ S.score=0;S.stars={};S.unlocked=1;S.records={}; save(); renderMap(); };

}

/* ===================== 關卡流程 ===================== */
function startLevel(li){
  if(S.finalized){ sWrong(); return; }
  if(LEVELS[li].wip){ sWrong(); return; }
  if(li>0 && !S.records[LEVELS[li-1].id]){ sWrong(); return; }
  clearTimer(); boardOff();
  var lv=LEVELS[li];
  G={ li:li, lv:lv, qi:0, tries:0, firstTry:0, wrongTotal:0, combo:0, bestCombo:0,
      codes:{}, gained:0, timeUp:false, sec:0, st:null, paused:false, stopped:false, frozen:false,
      sos:0, sosStep:0 };
  paintScore();
  /* 關卡導引：先用一個簡單的例子說明怎麼玩，按了「開始挑戰」才開始計時 */
  if(lv.demo) renderDemo();
  else runLevel();
}
/* 真正開始這一關（計時從這裡起算） */
function runLevel(){
  var lv=G.lv;
  timeChip.style.display=''; tickPaint();
  timer=setInterval(function(){
    if(G.paused) return;
    G.sec++; tickPaint();
    if(lv.countdown){
      var left=lv.timeLimit-G.sec;
      if(left<=10&&left>0) sTick();
      if(G.sec>=lv.timeLimit){ G.timeUp=true; clearTimer(); finish(); }
    }
  },1000);
  renderQ();
}
/* ---------- 關卡導引畫面 ----------
   lv.demo = { intro:'一句話說明這一關在做什麼',
               steps:[ {t:'步驟標題', d:'說明（可含 HTML）'} , … ],
               example:'示範用的簡單例子（HTML）'，
               note:'操作提醒' }                                   */
function renderDemo(){
  var lv=G.lv, d=lv.demo;
  app.innerHTML =
    '<div class="qhead"><span class="lvname">'+lv.id+'　'+lv.name+'</span>'
    + '<span class="cnt">開始前的說明</span><span class="spacer"></span>'
    + '<button class="btn ghost" style="padding:7px 14px;font-size:14px" id="back">← 回'+UNIT.home+'</button></div>'
    + '<div class="demohead"><div class="demoemoji">'+(d.emoji||'📖')+'</div>'
    + '<h2>'+esc(lv.name)+'　怎麼玩</h2><p>'+d.intro+'</p></div>'
    + (d.example ? '<div class="demoex"><h4>🔎 先看一個例子</h4>'+d.example+'</div>' : '')
    + '<div class="demosteps">'+(d.steps||[]).map(function(x,i){
        return '<div class="dstep"><span class="dnum">'+(i+1)+'</span>'
             + '<div><b>'+x.t+'</b><div class="dsd">'+x.d+'</div></div></div>';
      }).join('')+'</div>'
    + (d.note ? '<div class="demonote">💡 '+d.note+'</div>' : '')
    + '<div class="actions" style="margin-top:18px">'
    + '<button class="btn go" id="demoGo">我知道了，開始挑戰 →</button></div>';
  document.getElementById('back').onclick=function(){ clearTimer(); renderMap(); };
  document.getElementById('demoGo').onclick=function(){ sTap(); runLevel(); };
}
function tickPaint(){
  var lv=G.lv;
  if(lv.countdown){
    var left=lv.timeLimit-G.sec;
    timeChip.textContent='⏱ '+left;
    timeChip.className='chip'+(left<=20?' warn':'');
  }else{
    timeChip.textContent='⏱ '+fmt(G.sec);
    timeChip.className='chip'+(G.sec>lv.target?' over':'');
  }
}
function clearTimer(){ if(timer){clearInterval(timer);timer=null;} timeChip.style.display='none'; }

function renderQ(){
  var lv=G.lv, it=lv.items[G.qi];
  G.tries=0; G.sosStep=0;
  var pct=Math.round(G.qi/lv.items.length*100);
  var M=MODES[lv.mode];
  if(!M){ app.innerHTML='<div class="fb no">找不到玩法模組：'+esc(lv.mode)+'</div>'; return; }
  var sub = M.sub ? M.sub(it,lv) : '';
  var stage = M.stage(it,lv);

  app.innerHTML =
    '<div class="qhead"><span class="lvname">'+lv.id+'　'+lv.name+'</span>'
    + '<span class="cnt">第 '+(G.qi+1)+' / '+lv.items.length+' 題</span><span class="spacer"></span>'
    + '<button class="btn ghost" style="padding:7px 14px;font-size:14px" id="back">← 回'+UNIT.home+'</button></div>'
    + '<div class="bar"><i style="width:'+pct+'%"></i></div>'
    + (pet().lines ? '<div class="buddyrow"><div class="buddy talker" id="buddy">'+pet().f+'</div>'
                     + '<div class="bubble" id="bubble"></div></div>'
                   : '<div class="buddy" id="buddy">'+pet().f+'</div>')
    + '<div class="qtext">'+(M.title?M.title(it,lv):'')+'</div>'
    + '<div class="qsub">'+(HUNDRED?'<b class="qpt">本題 '+fmtPt(it.pt)+' 分</b>　'+sub:sub)+'</div>'
    + '<div class="hintbox">💡 '+lv.hint+'</div>'
    + '<div id="fb"></div>'
    + '<div class="stage" id="stage">'+(G.combo>=2?'<div class="combo">🔥 連續答對 ×'+G.combo+'</div>':'')+stage+'</div>'
    + '<div class="actions">'
    + (M.noCheck?'':'<button class="btn main" id="check">確定！</button>')
    + (sosList(it,lv).length?'<button class="btn ghost" id="sos">🆘 求救</button>':'')
    + '</div>'
    + '<div id="sosbox"></div>';
  document.getElementById('back').onclick=function(){ clearTimer(); renderMap(); };
  var ck=document.getElementById('check');
  if(ck) ck.onclick=check;
  var sb=document.getElementById('sos');
  if(sb) sb.onclick=showSos;
  buddyTalk(G.qi===0?'hi':'ask');
  bindStage();
}
/* ---------- 求救：一層一層給提示，永遠不給最後答案 ----------
   提示來源：題目的 it.sos（陣列），或玩法模組的 M.sos(it,lv) 回傳陣列 */
function sosList(it,lv){
  var M=MODES[lv.mode];
  var l = (M && M.sos) ? M.sos(it,lv) : it.sos;
  return (l && l.length) ? l : [];
}
function showSos(){
  var lv=G.lv, it=lv.items[G.qi], list=sosList(it,lv);
  if(!list.length) return;
  if(G.sosStep>=list.length){ sTap(); return; }
  G.sosStep++; G.sos++;
  sPick(); buddyTalk('sos');
  var box=document.getElementById('sosbox');
  box.innerHTML = '<div class="sosbox"><h4>🆘 一起想一想（'+G.sosStep+' / '+list.length+'）</h4>'
    + list.slice(0,G.sosStep).map(function(t,i){
        return '<div class="sosline"><span class="sn">'+(i+1)+'</span><div>'+t+'</div></div>';
      }).join('')
    + (G.sosStep<list.length
        ? '<div class="sosmore">還是不會？再按一次「🆘 求救」看下一個提示。</div>'
        : '<div class="sosmore done">提示到這裡為止——最後一步要自己算出來喔！</div>')
    + '</div>';
  var b=document.getElementById('sos');
  if(b) b.textContent = G.sosStep<list.length ? '🆘 再給一個提示' : '🆘 提示給完了';
}
function buddyReact(kind){
  var b=document.getElementById('buddy'); if(!b) return;
  var base=b.classList.contains('talker')?'buddy talker':'buddy';
  b.className=base; void b.offsetWidth; b.className=base+' '+kind;
  buddyTalk(kind==='happy'?'right':'wrong');
}
/* 會說話的夥伴：pet().lines = { hi, ask, right, wrong, sos }，每項是一串台詞，隨機挑一句 */
function buddyTalk(kind){
  var p=pet(), el=document.getElementById('bubble');
  if(!el || !p.lines || !p.lines[kind] || !p.lines[kind].length) return;
  var arr=p.lines[kind], t=arr[Math.floor(Math.random()*arr.length)];
  el.innerHTML='<b>'+esc(p.n)+'：</b>'+t;
  el.className='bubble'; void el.offsetWidth; el.className='bubble pop';
}

function bindStage(){
  var M=MODES[G.lv.mode];
  if(M && M.bind) M.bind();
}
function noteMis(code){
  G.codes[code]=(G.codes[code]||0)+1;
}

/* ---------- 選擇題的小處罰：扣分 + 罰停 1 秒 ---------- */

function isChoiceMode(){
  var M=MODES[G.lv.mode];
  if(!M) return false;
  return typeof M.choice==='function' ? !!M.choice() : !!M.choice;
}
function sPenalty(){ tone(300,.14,'square',.14); tone(200,.22,'square',.13,.13); }
function floatPen(txt){
  var r=scoreChip.getBoundingClientRect();
  var d=document.createElement('div');
  d.className='floatpen'; d.textContent=txt;
  d.style.left=(r.left+r.width/2-18)+'px';
  d.style.top=(r.top+4)+'px';
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },1000);
}
/* hard=true：猜得到的題型（扣分＋停 10 秒）
   hard=false：動手操作型（不扣分，只停 3 秒，讓學生慢下來但不怕嘗試） */
function applyPenalty(hard){
  var ms = hard ? FREEZE_MS : SOFT_FREEZE_MS;
  if(hard && !HUNDRED){
    G.gained=Math.max(0,G.gained-PENALTY);
    S.score=Math.max(0,S.score-PENALTY);
    paintScore(); save();
    floatPen('−'+PENALTY);
    scoreChip.classList.add('hit');
    setTimeout(function(){ scoreChip.classList.remove('hit'); },620);
  }
  sPenalty();

  /* 罰停：選項與確定鍵鎖住
     記住是哪一局：罰停期間學生可能已經離開關卡（G 變成 null）或開了新的一關 */
  var g=G;
  g.frozen=true;
  var stage=document.getElementById('stage');
  var btn=document.getElementById('check');
  if(stage) stage.classList.add('frozen');
  if(btn) btn.disabled=true;
  var fb=document.querySelector('.fb');
  var bar=document.createElement('div');
  bar.className='freezebar'; bar.id='freezebar';
  var tail = hard ? '秒…利用這段時間把上面的提示看一次' : '秒…慢慢來，再檢查一次';
  bar.innerHTML='⏳ 罰停 <b>'+Math.round(ms/1000)+'</b> '+tail;
  if(fb) fb.appendChild(bar);
  var t0=Date.now();
  var iv=setInterval(function(){
    var rest=Math.max(0,Math.ceil((ms-(Date.now()-t0))/1000));
    var b=document.getElementById('freezebar');
    if(b) b.innerHTML='⏳ 罰停 <b>'+rest+'</b> '+tail;
  },200);
  setTimeout(function(){
    clearInterval(iv);
    g.frozen=false;
    if(G!==g) return;
    var st=document.getElementById('stage'); if(st) st.classList.remove('frozen');
    var bt=document.getElementById('check'); if(bt) bt.disabled=false;
    var b=document.getElementById('freezebar');
    if(b) b.outerHTML='<div class="freezebar done">✅ 可以再試一次了</div>';
    sTap();
  },ms);
}

/* ===================== 判題 ===================== */
function check(){
  if(G&&G.frozen) return;
  var lv=G.lv, it=lv.items[G.qi], M=MODES[lv.mode];
  G.tries++;
  var res = M.judge(it,lv) || {};
  /* halt：題目還沒作答完，不算一次嘗試，也不罰
     tone:'ok' 用在多步驟的關卡——這一步做對了，繼續下一步 */
  if(res.halt){
    var tone = res.tone==='ok' ? 'ok' : 'no';
    showFb(tone, res.msg||'還沒做完喔。');
    G.tries--;
    if(tone==='ok'){ sPick(); }
    else { sWrong(); flash('no'); }
    return;
  }
  if(res.ok) onRight(it); else onWrong(it, res.code||null);
}
function onRight(it){
  var lv=G.lv;
  G.combo++; if(G.combo>G.bestCombo) G.bestCombo=G.combo;
  var base = G.tries===1?10:4;
  var bonus = (G.tries===1 && G.combo>=3) ? 3 : 0;
  if(HUNDRED){ base = G.tries===1 ? (it.pt||0) : (G.tries===2 ? (it.pt||0)/2 : 0); bonus = 0; }
  if(G.tries===1) G.firstTry++;
  G.gained+=base+bonus; S.score+=base+bonus; paintScore();
  buddyReact('happy'); flash('ok');
  if(G.combo>=3) sCombo(G.combo); else sRight();
  burstAt(document.getElementById('stage'),['#ffb020','#2fa46b','#fff','#3aa6e0'],40);

  var msg = G.tries===1?('✅ 答對了！＋'+base+' 分'):('✅ 這次對了！＋'+base+' 分');
  if(HUNDRED) msg = G.tries===1 ? ('✅ 答對了！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分）')
                : base>0 ? ('✅ 訂正成功！＋'+fmtPt(base)+' 分（本題 '+fmtPt(it.pt)+' 分，訂正拿一半）')
                         : ('✅ 做對了！看過答案才做對，這題不加分（本題 '+fmtPt(it.pt)+' 分）');
  if(bonus) msg += '　🔥 連續答對 ×'+G.combo+' 追加 ＋'+bonus+' 分';
  var M=MODES[G.lv.mode];
  var extra = M.onRight ? M.onRight(it) : null;
  if(extra && extra.msg) msg += extra.msg;
  showFb('ok',msg);
  var chk=document.getElementById('check');
  if(chk) chk.disabled=true;
  /* after：模組要改畫面的副作用，等回饋和按鈕都處理完才跑 */
  if(extra && extra.after) extra.after();
  /* hold：模組自己接管接下來的流程（例如換鈔機要先動手驗證） */
  if(extra && extra.hold) return;
  nextButton();
}
/* 玩法模組接管流程時，可以自己叫出「下一題」 */
function nextButton(){
  var last=G.qi+1>=G.lv.items.length;
  var act=document.querySelector('.actions');
  if(!act) return;
  act.innerHTML='<button class="btn go" id="next">'+(last?'看結果 →':'下一題 →')+'</button>';
  var b=document.getElementById('next');
  b.onclick=function(){
    G.qi++; sTap();
    if(G.qi<G.lv.items.length) renderQ(); else { clearTimer(); finish(); }
  };
  b.focus();
}
function onWrong(it,code){
  G.combo=0; G.wrongTotal++;
  buddyReact('sad'); sWrong(); flash('no');
  var pen=isChoiceMode();
  var m='';
  if(HUNDRED) m += '<div class="penline'+(pen?'':' soft')+'">'+(pen?'⛔ <b>選錯了</b>':'⏳ <b>再試一次</b>')
             + '　·　'+(G.tries===1?'訂正後可以拿這題一半的分數':'這題已經沒有分數了，但還是要做對')
             + '　·　先停 <b>'+Math.round((pen?FREEZE_MS:SOFT_FREEZE_MS)/1000)+' 秒</b></div>';
  else if(pen) m += '<div class="penline">⛔ <b>選錯了</b>　扣 <b>'+PENALTY+' 分</b>　·　罰停 <b>'
             + Math.round(FREEZE_MS/1000)+' 秒</b></div>';
  else    m += '<div class="penline soft">⏳ <b>再試一次</b>　不扣分　·　先停 <b>'
             + Math.round(SOFT_FREEZE_MS/1000)+' 秒</b>，把下面的提示看一次</div>';
  if(code){ noteMis(code); m+='💡 '+MIS[code]+'<span class="code">'+code+'</span>'; }
  else m+='再想想看：'+G.lv.hint;
  var M=MODES[G.lv.mode];
  var ex = M.onWrong ? M.onWrong(it,code) : null;
  if(ex && ex.msg) m += ex.msg;
  if(!(ex && ex.hold) && G.tries>=2) m += '<div class="ans">'+answerText(it)+'</div>';
  showFb('no',m);
  if(ex && ex.after) ex.after();
  applyPenalty(pen);
}
function answerText(it){
  var M=MODES[G.lv.mode];
  return (M && M.answer) ? M.answer(it) : '';
}
function showFb(kind,html){
  document.getElementById('fb').innerHTML='<div class="fb '+kind+'">'+html+'</div>';
}

/* ===================== 停止鍵：先推算點數，再決定要不要停 ===================== */
function estimatePoints(provPerf){
  /* 沒玩過的關卡一律算 0 分——只玩一關不可能拿到滿點 */
  var sum=0, got=0;
  LEVELS.forEach(function(lv){
    if(G && lv.id===G.lv.id){ if(provPerf!=null){ sum+=provPerf; got++; } return; }
    var r=S.records[lv.id]; if(r){ sum+=r.perf; got++; }
  });
  if(!got) return null;
  var avg=sum/LEVELS.length;
  return { avg:avg, n:got, C:curvePoints(avg) };
}
/* 依排行榜推算：現在收手可以拿幾點 */
function rankEstHTML(est){
  var me=provisionalSummary();
  var R=myRankNow(me);
  if(HUNDRED) return '<div class="ptrow"><span>目前總分</span><b>'+fmtPt(me.gained)+' / 100 分</b></div>'
      + '<div class="ptrow"><span>目前總用時</span><b>'+fmt(me.secs)+'</b></div>'
      + '<div class="ptrow"><span>完成關卡</span><b>'+me.done+' / '+LEVELS.length+' 關</b></div>'
      + '<div class="ptrow"><span>班上排名（總分高→用時短）</span><b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b></div>'
      + '<div class="estsub">沒玩的關卡沒有分數。</div>';
  var h='<div class="ptrow"><span>目前總得分（四關累計）</span><b>'+me.gained+' 分</b></div>'
      + '<div class="ptrow"><span>目前總用時</span><b>'+fmt(me.secs)+'</b></div>'
      + '<div class="ptrow"><span>完成關卡</span><b>'+me.done+' / '+LEVELS.length+' 關</b></div>';
  if(R.pts){
    h += '<div class="ptrow"><span>班上排名（得分高→用時短）</span><b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b></div>'
       + '<div class="estbig">🎁 可得 '+R.pts+' 點</div>'
       + '<div class="estsub">排名在全班<b>前 1/3</b> 給 3 點、<b>中間 1/3</b> 給 2 點、<b>後 1/3</b> 給 1 點。'

/* ===================== 單關結算 ===================== */
function finish(){
  clearTimer();
  var lv=G.lv, total=lv.items.length;
  var P=levelPerf(G.firstTry,total,G.sec,lv.target,G.timeUp);
  var stars=P.perf>=NEED_3?3:P.perf>=NEED_2?2:1;
  if(HUNDRED){ var ratio=lvMax(lv)?G.gained/lvMax(lv):0; stars=ratio>=0.9?3:ratio>=0.7?2:1; }
  if(stars>(S.stars[lv.id]||0)) S.stars[lv.id]=stars;
  var old=S.records[lv.id];
  var plays=(old&&old.plays?old.plays:0)+1;
  var kept = !!old && !betterRun(G.gained,G.sec,old);
  if(!kept){
    S.records[lv.id]={sec:G.sec,gained:G.gained,firstTry:G.firstTry,total:total,
                      acc:P.acc,spd:P.spd,perf:P.perf,timeUp:G.timeUp,
                      stopped:!!G.stopped,done:G.qi,plays:plays,sos:G.sos||0};
  }else{
    old.plays=plays;
  }
  save(); paintScore(); pushScore(function(){ refreshClass(paintRank); });
  if(!G.timeUp&&!G.stopped){ sClear(); confetti(); if(stars===3) setTimeout(function(){sStar();confetti();},450); }
  else if(G.stopped) sMerge();
  else sWrong();

  var codes=Object.keys(G.codes).map(function(c){return [c,G.codes[c]];}).sort(function(a,b){return b[1]-a[1];});
  var remember = codes.length
    ? '<div class="remember"><h4>📌 這一關要特別記住</h4><ul>'
      + codes.map(function(p){return '<li>'+MIS[p[0]]+'<span class="code">'+p[0]+' ×'+p[1]+'</span></li>';}).join('')
      + '</ul></div>'
    : (G.wrongTotal
        ? '<div class="allgood">👍 '+(UNIT.slipText||'沒有踩到常見的迷思陷阱，錯的是操作上的小失誤。')+'</div>'
        : '<div class="allgood">🎉 全部一次做對，'+(UNIT.praiseText||'這一關的觀念很穩！')+'</div>');
  var allDone=LEVELS.every(function(l){return S.records[l.id];});

  app.innerHTML =
    '<div class="rhead"><div class="emoji">'+pet().f+(G.timeUp?'⏰':(stars===3?'🏆':stars===2?'🎖️':'💪'))+'</div>'
    + '<h2>'+(G.timeUp?'時間到！':(G.stopped?lv.id+' '+lv.name+'　提早結算':lv.id+' '+lv.name+' 完成'))+'</h2>'
    + '<div style="font-size:26px;letter-spacing:3px;color:#ffb020">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div></div>'
    + (kept?'<div class="chase">📌 這次 '+fmtPt(G.gained)+' 分，沒有超過之前的 <b>'+fmtPt(old.gained)+' 分</b>，保留之前比較好的成績。</div>':'')
    + '<div class="rstats">'
    + '<div class="stat"><b>'+fmt(G.sec)+'</b><span>⏱ 用時</span></div>'
    + '<div class="stat"><b>'+G.firstTry+'/'+total+'</b><span>一次就做對</span></div>'
    + (G.stopped?'<div class="stat"><b>'+G.qi+'/'+total+'</b><span>⏹ 做到第幾題</span></div>':'')
    + (HUNDRED ? '<div class="stat pt"><b>'+fmtPt(G.gained)+' / '+fmtPt(lvMax(lv))+'</b><span>⭐ 本關得分</span></div>'
               + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '') + '</div>'
               + '<div class="ptbox"><h4>⭐ 分數怎麼算的</h4>'
               + '<div class="ptrow"><span>'+(lv.items.every(function(x){ return x.pt===lv.items[0].pt; })
                   ? '每一題 '+fmtPt(lv.items[0].pt)+' 分，共 '+total+' 題'
                   : '每一題的配分不一樣（題目下方會寫「本題 幾分」）')+'</span><b>本關 '+fmtPt(lvMax(lv))+' 分</b></div>'
               + '<div class="ptrow"><span>一次做對 '+G.firstTry+'/'+total+' 題：拿滿分；訂正後做對：拿一半</span><b>'+fmtPt(G.gained)+' 分</b></div>'
               + '<div class="ptrow"><span>全部關卡加起來</span><b>滿分 100 分</b></div></div>'
    : '<div class="stat"><b>+'+G.gained+'</b><span>⭐ 本關得分</span></div>'
    + '<div class="stat"><b>×'+G.bestCombo+'</b><span>🔥 最長連擊</span></div>'
    + (G.sos ? '<div class="stat"><b>'+G.sos+'</b><span>🆘 求救次數</span></div>' : '')
    + '<div class="stat pt"><b>'+pctText(P.perf)+'</b><span>🎁 本關表現</span></div></div>'
    + '<div class="ptbox"><h4>🎁 本關表現怎麼算的（正確度 × 速度倍率）</h4>'
    + '<div class="ptrow"><span>正確度：一次做對 '+G.firstTry+'/'+total+'</span><b>'+pctText(P.acc)+'</b></div>'
    + '<div class="ptrow"><span>速度倍率：用時 '+fmt(G.sec)+'（'+fmt(P.fast)+' 以內才是滿倍率）'
      +(G.timeUp?'（時間到）':'')+'</span><b>× '+pctText(P.mult)+'</b></div>'
    + '<div class="ptrow"><span>本關表現（四關平均後才換算點數）</span><b>'+pctText(P.perf)+'</b></div></div>')
    + remember
    + '<div class="actions" style="margin-top:20px">'
    + '<button class="btn ghost" id="again">重玩這一關</button>'
    + (allDone?'<button class="btn go" id="report">🏅 看'+UNIT.certName+' →</button><button class="btn ghost" id="map">回'+UNIT.home+'</button>'
              :'<button class="btn main" id="map">回'+UNIT.home+' →</button>')
    + '</div>';
  document.getElementById('again').onclick=function(){ startLevel(G.li); };
  document.getElementById('map').onclick=renderMap;
  var rp=document.getElementById('report'); if(rp) rp.onclick=renderReport;
}

/* ===================== 工程師證書（總結算） ===================== */
var REPORT_SYNCED=false;
function renderReport(){
  clearTimer(); boardOff(); paintPet(); paintScore(); pushScore();
  if(!REPORT_SYNCED){
    REPORT_SYNCED=true;
    refreshClass(function(){ if(document.querySelector('.rank')) renderReport(); });
  }
  var secs=0,gained=0,ft=0,tot=0,done=0,perfSum=0;
  var rows=LEVELS.map(function(lv){
    var r=S.records[lv.id];
    if(!r) return '<tr><td class="nm">'+lv.id+' '+lv.name+'</td><td class="miss">—</td>'
      +'<td class="miss">—</td><td class="miss">—</td><td class="miss">未挑戰</td></tr>';
    done++; secs+=r.sec; gained+=r.gained; ft+=r.firstTry; tot+=r.total; perfSum+=r.perf;
    return '<tr><td class="nm">'+lv.id+' '+lv.name+'</td><td>'+fmt(r.sec)
      +(r.timeUp?' ⏰':'')+(r.stopped?' ⏹':'')+'</td>'
      +'<td>'+r.firstTry+'/'+r.total+'</td><td>'+(HUNDRED?fmtPt(r.gained)+' / '+fmtPt(lvMax(lv)):r.gained)+'</td>'
      +'<td class="pts">'+(HUNDRED?(lvMax(lv)?pctText(r.gained/lvMax(lv)):'—'):pctText(r.perf))+'</td></tr>';
  }).join('');
  var perfAll=perfSum/LEVELS.length, C=curvePoints(perfAll);
  var me=mySummary(), R=myRankNow(me);
  var finalPts=R.pts||C.pts;
  var rank=UNIT.ranks[Math.max(0,Math.min(2,finalPts-1))];
  if(HUNDRED) rank=UNIT.ranks[gained>=90?2:(gained>=70?1:0)];
  sClear(); confetti(); setTimeout(confetti,600);

  app.innerHTML =
    '<div class="rhead"><div class="emoji">'+pet().f+'🏅</div>'
    + '<h2>'+esc(S.name||UNIT.roleAnon)+' 的'+UNIT.certName+'</h2>'
    + '<p style="color:#7b8b95;font-size:14.5px">'+UNIT.sub+'　·　'+(HUNDRED?'各關':'四關')+'全紀錄（每關取最好一次）</p></div>'
    + '<div class="tablewrap"><table class="sheet"><thead><tr>'
    + '<th>'+UNIT.levelWord+'</th><th>⏱ 用時</th><th>一次做對</th><th>⭐ 得分</th><th>'+(HUNDRED?'得分率':'🎁 表現')+'</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table></div>'
    + '<div class="grand">'
    + '<div class="stat"><b>'+fmt(secs)+'</b><span>⏱ 總用時</span></div>'
    + '<div class="stat"><b>'+ft+'/'+tot+'</b><span>一次做對</span></div>'
    + (HUNDRED ? '<div class="stat pt"><b>'+fmtPt(gained)+' / 100</b><span>⭐ 總分</span></div></div>'
               + '<div class="rank"><div class="big">⭐ '+fmtPt(gained)+' 分</div><div class="ttl">'+rank+'</div>'
               + '<div class="sub">班上排名 <b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b>（依總分 '+fmtPt(me.gained)+' 分、總用時 '+fmt(me.secs)+'）。</div></div>'
    : '<div class="stat"><b>'+gained+'</b><span>⭐ 總得分</span></div>'
    + '<div class="stat pt"><b>'+pctText(perfAll)+'</b><span>🎁 平均表現</span></div></div>'
    + '<div class="rank"><div class="big">🎁 '+finalPts+' 點</div><div class="ttl">'+rank+'</div>'
    + '<div class="sub">'
    + (R.pts
        ? '班上排名 <b>第 '+R.rank+' 名 / 共 '+R.n+' 人</b>（依總得分 '+me.gained+' 分、總用時 '+fmt(me.secs)+'）。<br>'
          + '前 1/3 給 3 點、中間 1/3 給 2 點、後 1/3 給 1 點。'
        : '班上人數不足 '+MIN_CLASS+' 人，改用絕對標準：四關平均表現 '+pctText(perfAll)
          + ' → 3 × '+perfAll.toFixed(2)+'<sup>'+CURVE_EXP+'</sup> ＝ '+C.raw.toFixed(2)+' → <b>'+C.pts+' 點</b>。')
    + '</div></div>')
    + '<div class="bonus">🏁 '+UNIT.nextTeaser+'</div>'
    + '<div class="actions" style="margin-top:20px">'
    + '<button class="btn go" id="board">🏆 看排行榜 →</button>'
    + '<button class="btn main" id="map">回'+UNIT.home+'</button></div>';
  document.getElementById('board').onclick=renderBoard;
  document.getElementById('map').onclick=renderMap;
}

function m6gcd(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
function m6lcm(a,b){ return a/m6gcd(a,b)*b; }
function m6isPrime(n){ if(n<2) return false; for(var i=2;i*i<=n;i++) if(n%i===0) return false; return true; }
function m6factors(n){ var a=[]; for(var i=1;i<=n;i++) if(n%i===0) a.push(i); return a; }
function m6nums(s){ return (String(s==null?'':s).match(/\d+/g)||[]).map(Number); }
function m6num(s){ var a=m6nums(s); return a.length===1 ? a[0] : NaN; }
function m6sortN(a){ return a.slice().sort(function(x,y){ return x-y; }); }
function m6same(a,b){ a=m6sortN(a); b=m6sortN(b); if(a.length!==b.length) return false;
  for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false; return true; }

var M6_CHISELS = [2,3,5,7,11,13,17,19];
function stageMine(it){
  G.st={ act:null, done:false, sel:null, cracked:{}, left:it.strikes||0, gem:{}, mark:{}, pairs:[], v:{}, trial:null, trialsLeft:3, msg:'' };
  return m6story('⛏️', it.text);
}
function m6rockHTML(n, i, st, it){
  var cls='m6rock', inner='<b>'+n+'</b>';
  if(it.kind==='gem'){
    if(st.sel===i) cls+=' sel';
    if(st.cracked[i]){ cls+=' cracked'; inner+='<small>＝ '+st.cracked[i][0]+' × '+st.cracked[i][1]+'</small>'; }
    if(st.gem[i]){ cls+=' gem'; inner='<span class="m6gemic">💎</span>'+inner; }
  } else {
    if(st.mark[i]) cls+=' mark';
    if(st.done){ var ok = n%it.d===0; cls += ok?' cracked':''; if(ok) inner+='<small>＝ '+it.d+' × '+(n/it.d)+'</small>'; }
  }
  return '<button class="'+cls+'" data-i="'+i+'">'+inner+'</button>';
}
function paintMine(){
  var it=m6itemNow(), st=G.st, z=document.getElementById('zone'), h='';
  if(it.kind==='gem'){
    h += '<div class="m6rocks">'+it.rocks.map(function(n,i){ return m6rockHTML(n,i,st,it); }).join('')+'</div>'
       + '<div class="m6tools"><span class="m6lab">🔨 鑿子（剩 <b>'+st.left+'</b> 次）：</span>'
       + M6_CHISELS.map(function(c){ return '<button class="m6chip" data-c="'+c+'"'+(st.left<=0||st.done?' disabled':'')+'>'+c+'</button>'; }).join('')
       + '</div>' + m6msg()

}
function judgeMine(it){
  var st=G.st, a=st.act; st.act=null;
  if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
  if(a!=='submit') return {halt:true, msg:'先操作，再按確定。'};
  var i, pick=[];
  if(it.kind==='gem'){
    it.rocks.forEach(function(n,i){ if(st.gem[i]) pick.push(n); });
    if(!pick.length) return {halt:true, msg:'先點石頭、按「💎 標成寶石」，把你認為的質數標起來。'};
    var want=it.rocks.filter(m6isPrime);
    if(m6same(pick,want)) return {ok:true};
    var bad=pick.filter(function(n){ return !m6isPrime(n); });
    if(bad.length) return {ok:false, code: bad.some(function(n){ return n%3===0; }) ? 'DIV3_HIDE' : 'PRIME_HIDE'};
    if(want.indexOf(2)>=0 && pick.indexOf(2)<0) return {ok:false, code:'PRIME_TWO'};
    return {ok:false, code:'PRIME_MISS'};
  }
  if(it.kind==='bet'){
    it.rocks.forEach(function(n,i){ if(st.mark[i]) pick.push(n); });
    if(!pick.length) return {halt:true, msg:'先點你認為敲得開的石頭下注。'};
    if(m6same(pick, it.rocks.filter(function(n){ return n%it.d===0; }))) return {ok:true};
    return {ok:false, code:it.code};
  }
  if(it.kind==='truth'){
    var any=false, good=true;
    it.cards.forEach(function(c,i){ if(st.mark[i]) any=true; if(!!st.mark[i]!==c.ok) good=false; });
    if(!any) return {halt:true, msg:'先點選你認為對的敘述。'};
    return good ? {ok:true} : {ok:false, code:'TRUTH'};
  }
  if(it.kind==='ways'){
    var v=m6num(st.v.ans);
    if(isNaN(v)) return {halt:true, msg:'在框裡填一個數。'};
    return v===it.ans ? {ok:true} : {ok:false, code:'WAYS_PAIR'};
  }
  if(it.kind==='delta'){
    var arr=m6nums(st.v.ans);
    if(!arr.length) return {halt:true, msg:'在框裡填上 △ 可能的數，用「、」隔開。'};
    if(m6same(arr,it.ans)) return {ok:true};
    if(arr.some(function(x){ return x<=it.min; })) return {ok:false, code:'DELTA_MIN'};
    return {ok:false, code:'DELTA_FACT'};
  }
  if(it.kind==='rev'){
    var n=m6num(st.v.ans);
    if(isNaN(n)) return {halt:true, msg:'在 N ＝ 的框裡填一個數。'};
    return n===it.ans ? {ok:true} : {ok:false, code:'REV_PAIR'};
  }
  return {halt:true, msg:'？'};
}
function answerMine(it){
  if(it.kind==='gem'){ return '正解：質數是 '+it.rocks.filter(m6isPrime).join('、')+'。其他的都敲得開，例如 '
      + it.rocks.filter(function(n){ return !m6isPrime(n); }).slice(0,3).map(function(n){ var f=m6factors(n)[1]; return n+' ＝ '+f+' × '+(n/f); }).join('、')+'。'; }
  if(it.kind==='bet') return '正解：'+it.rocks.filter(function(n){ return n%it.d===0; }).join('、')+' 是 '+it.d+' 的倍數。';
  if(it.kind==='truth') return '正解：對的是「'+it.cards.filter(function(c){ return c.ok; }).map(function(c){ return c.t; }).join('」「')+'」。';
  if(it.kind==='ways') return '正解：'+it.n+' 的因數有 '+m6factors(it.n).join('、')+'，共 '+it.ans+' 個，所以有 '+it.ans+' 種分法。';
  if(it.kind==='delta') return '正解：'+it.n+' 的因數有 '+m6factors(it.n).join('、')+'；△ ＝ 因數 ＋ '+it.minus
      +'，又要大於 '+it.min+'，所以 △ ＝ '+it.ans.join('、')+'。';
  if(it.kind==='rev') return '正解：N ＝ '+it.ans+'，因數是 '+m6factors(it.ans).join('、')+'。';
  return '';
}
function sosMine(it){
  if(it.kind==='gem') return [ '質數只有 1 和自己兩個因數。<b>敲得開</b>（還有別的因數）的就不是質數。',
      '鑿子不夠每顆都敲，先用判別法：個位是偶數 → 2 的倍數；各位數字和是 3 的倍數 → 3 的倍數；個位 0 或 5 → 5 的倍數。',
      '過了 2、3、5 還要想 7、11、13。例如 119 ＝ 7 × 17、143 ＝ 11 × 13，看起來像質數其實不是。' ];
  if(it.kind==='bet'){
    if(it.d===6) return [ '6 ＝ 2 × 3，要<b>同時</b>是 2 和 3 的倍數。', '先刪掉個位是奇數的，再算剩下的各位數字和是不是 3 的倍數。',
      '例如 4716：個位 6 是偶數；4＋7＋1＋6 ＝ 18 是 3 的倍數 → 是 6 的倍數。換你一顆一顆檢查。' ];
    if(it.d===11) return [ '11 的倍數判別法：從個位起，奇數位數字的和、偶數位數字的和，相減。',
      '差是 0 或 11 的倍數，就是 11 的倍數。', '例如 2728：奇數位 8＋7 ＝ 15，偶數位 2＋2 ＝ 4，差 11 → 是 11 的倍數。換你算。' ];
    return [ '3 的倍數：各位數字加起來是 3 的倍數。', '例如 4512：4＋5＋1＋2 ＝ 12，12 是 3 的倍數 → 4512 是 3 的倍數。換你一顆一顆加。' ];
  }
  if(it.kind==='truth') return [ '每一句都試著找<b>反例</b>：只要有一個例子不成立，那句就是錯的。',
      '想想 2 是不是質數？2 是偶數嗎？', '分組的方法數 ＝ 人數的因數個數。例如 9 人：1、3、9，共 3 種。' ];
  if(it.kind==='ways') return [ '每袋幾顆，就是 '+it.n+' 的一個因數。所以要找 '+it.n+' 有幾個因數。',
      '用鑿子從 1、2、3…一個一個敲，敲開就得到一對因數。', '兩個因數越來越接近時就可以停了。例如 18：1×18、2×9、3×6，共 6 個因數。' ];
  if(it.kind==='delta') return [ '91 ÷（△ − 20）是整數，代表（△ − 20）是 91 的<b>因數</b>。',
      '先用鑿子把 91 的因數全部敲出來，每一個再加 20 就是 △。', '最後別忘了：△ 要大於 '+it.min+'。例如 12 ÷（□ − 5）是整數：□ − 5 可以是 1、2、3、4、6、12。' ];
  if(it.kind==='rev') return [ '因數是成對的：最小的和最大的一對、第二小的和第二大的一對……',
      '看看已知的數：第 2 個和倒數第 2 個是一對，相乘就是 N。', '例如因數排成 1，3，□，15：3 和 □ 一對，1 和 15 一對，所以 N ＝ 15。換你找這題的一對。' ];
  return [];
}

function stageBeat(it){

function m6trackSVG(it, beat, win, from){
  from=from||0;
  var W=600, H=112, x=function(v){ return 20+(v-from)/(win-from)*(W-40); }, s='';
  s+='<line x1="20" y1="60" x2="'+(W-20)+'" y2="60" stroke="#8a7fb8" stroke-width="3"/>';
  var step = (win-from)>200 ? ((win-from)>400?100:50) : ((win-from)>100?20:10);
  for(var t=Math.ceil(from/step)*step;t<=win;t+=step) s+='<line x1="'+x(t)+'" y1="56" x2="'+x(t)+'" y2="64" stroke="#8a7fb8"/><text x="'+x(t)+'" y="104" font-size="12" text-anchor="middle" fill="#6b6590">'+t+'</text>';
  if(it.a && it.b){
    for(var p=Math.ceil(from/it.a)*it.a;p<=win;p+=it.a) s+='<path d="M'+x(p)+',58 v-22 l12,6 l-12,6" fill="#ffffff" stroke="#2a2250" stroke-width="1.5"/>';
    for(var q=Math.ceil(from/it.b)*it.b;q<=win;q+=it.b) s+='<path d="M'+x(q)+',62 v22 l12,-6 l-12,-6" fill="#e8453c" stroke="#2a2250" stroke-width="1.5"/>';
  }
  if(beat){
    for(var g=Math.ceil(from/beat)*beat; g<=win; g+=beat){
      var both = (!it.a || (g%it.a===0 && g%it.b===0));
      s+='<circle cx="'+x(g)+'" cy="60" r="7" fill="'+(both?'#ffb84d':'#bbb')+'" stroke="#2a2250" stroke-width="1.5"/>'
       + (it.a ? '<text x="'+x(g)+'" y="22" font-size="13" text-anchor="middle">'+(both?'✔':'✖')+'</text>' : '');
    }
  }
  return '<svg class="m6svg" viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';
}
function m6cutSVG(W0,H0,side,mode){
  /* mode 'cut'：大紙切小正方形；mode 'tile'：用長方形拼成大正方形 */
  var box=260, sc, s='';
  if(mode==='cut'){
    sc=box/Math.max(W0,H0);
    var w=W0*sc, h=H0*sc;
    s+='<rect x="10" y="10" width="'+w+'" height="'+h+'" fill="#fff6e0" stroke="#2a2250" stroke-width="2"/>';
    if(side){
      var nx=Math.floor(W0/side), ny=Math.floor(H0/side);
      for(var i=0;i<nx;i++) for(var j=0;j<ny;j++)
        s+='<rect x="'+(10+i*side*sc)+'" y="'+(10+j*side*sc)+'" width="'+side*sc+'" height="'+side*sc+'" fill="#bfe6c9" stroke="#2a8a4a" stroke-width="1"/>';
      if(W0%side) s+='<rect x="'+(10+nx*side*sc)+'" y="10" width="'+(W0%side)*sc+'" height="'+h+'" fill="#f7b3ad" opacity=".85"/>';
      if(H0%side) s+='<rect x="10" y="'+(10+ny*side*sc)+'" width="'+w+'" height="'+(H0%side)*sc+'" fill="#f7b3ad" opacity=".85"/>';
    }
    s+='<text x="'+(10+w/2)+'" y="'+(h+30)+'" font-size="13" text-anchor="middle" fill="#2a2250">長 '+W0+' cm</text>'
     + '<text x="'+(w+16)+'" y="'+(10+h/2)+'" font-size="13" fill="#2a2250">寬 '+H0+'</text>';
    return '<svg class="m6svg sq" viewBox="0 0 '+(box+70)+' '+(h+40)+'">'+s+'</svg>';
  }
  var S0=side||Math.max(W0,H0);
  sc=box/Math.max(S0,W0,H0);
  if(!side) return '<svg class="m6svg sq" viewBox="0 0 '+(box+40)+' '+(H0*sc+40)+'"><rect x="10" y="10" width="'+W0*sc+'" height="'+H0*sc+'" fill="#bfe6c9" stroke="#2a8a4a"/>'
    + '<text x="'+(10+W0*sc/2)+'" y="'+(H0*sc+30)+'" font-size="13" text-anchor="middle">一張 '+W0+' × '+H0+' cm</text></svg>';
  for(var a=0;a*W0<S0;a++) for(var b=0;b*H0<S0;b++){
    var over = (a+1)*W0>S0 || (b+1)*H0>S0;
    s+='<rect x="'+(10+a*W0*sc)+'" y="'+(10+b*H0*sc)+'" width="'+W0*sc+'" height="'+H0*sc+'" fill="'+(over?'#f7b3ad':'#bfe6c9')+'" stroke="#2a8a4a" stroke-width="1"/>';
  }
  if(side) s+='<rect x="10" y="10" width="'+S0*sc+'" height="'+S0*sc+'" fill="none" stroke="#2a2250" stroke-width="3" stroke-dasharray="7 4"/>';
  return '<svg class="m6svg sq" viewBox="0 0 '+(box+40)+' '+(box+40)+'">'+s+'</svg>';
}
function paintBeat(){
  var it=m6itemNow(), st=G.st, z=document.getElementById('zone'), h='';
  var stepTxt=function(t){ return '<div class="m6step">'+t+'</div>'; };
  if(it.kind==='track' || it.kind==='range'){
    if(st.step===0){
      h += stepTxt('① 調出兩條跑道「同時落地」的最小節拍')
         + m6trackSVG(it, st.beat, it.win||m6lcm(it.a,it.b)*3)
         + '<div class="m6legend">'+(it.names?'⬆ '+it.names[0]+'：每 '+it.a+' 一支　⬇ '+it.names[1]+'：每 '+it.b+' 一支':'⬆ 每 '+it.a+'　⬇ 每 '+it.b)+'</div>'
         + m6msg()
         + '<div class="m6ansrow">同步節拍 '+m6in('beat',st.v.beat,80)+' <button class="btn ghost" id="m6run">▶ 試跑</button></div>'
         + '<div class="m6btns"><button class="btn main m6go" id="m6sub">✅ 確定節拍</button></div>';
    } else if(it.kind==='track'){
      h += stepTxt('② 節拍 '+st.beat+' 找到了！整條 '+it.L+' '+it.unit+' 都算進去')
         + m6trackSVG(it, st.beat, it.win)
         + '<div class="m6note">跑道只畫了前 '+it.win+' '+it.unit+'，後面一樣每 '+st.beat+' '+it.unit+' 一處，兩端都要算。</div>' + m6msg()
         + '<div class="m6ansrow">兩樣都有的地點共 '+m6in('ans',st.v.ans,70)+' 處</div>'
         + '<div class="m6btns"><button class="btn main m6go" id="m6sub"'+(st.done?' disabled':'')+'>✅ 確定</button></div>';
    } else {
      var from=it.lo-Math.round((it.hi-it.lo)/2), to=it.hi+Math.round((it.hi-it.lo)/2), marks='';
      for(var g=Math.ceil(from/st.beat)*st.beat; g<=to; g+=st.beat)
        marks += '<button class="m6chip big'+(st.pick[g]?' on':'')+'" data-g="'+g+'"'+(st.done?' disabled':'')+'>'+g+'</button>';
      h += stepTxt('② 節拍 '+st.beat+' 的落地點（都分得完）。點出在 '+it.lo+'～'+it.hi+' 之間的')
         + m6trackSVG({}, st.beat, to, from)
         + '<div class="m6tools">'+marks+'</div>' + m6msg()
         + '<div class="m6btns"><button class="btn main m6go" id="m6sub"'+(st.done?' disabled':'')+'>✅ 確定</button></div>';
    }
  } else if(it.kind==='cut' || it.kind==='tile'){
    var isCut=it.kind==='cut';

    };

       + '<div class="m6piles">'+pile(it.A,it.names[0],it.units[0])+pile(it.B,it.names[1],it.units[1])+'</div>' + m6msg();

function judgeBeat(it){
  var st=G.st, a=st.act; st.act=null;
  if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
  if(a!=='submit') return {halt:true, msg:'先操作，再按確定。'};
  var v, L=m6lcm(it.a||1,it.b||1);
  if(it.kind==='track' || it.kind==='range'){
    if(st.step===0){
      v=m6num(st.v.beat);
      if(isNaN(v)) return {halt:true, msg:'先輸入同步節拍。'};
      st.beat=v;
      if(v%it.a||v%it.b){ paintBeat(); return {ok:false, code:'LCM_NOT_COMMON'}; }
      if(v!==L){ paintBeat(); return {ok:false, code:'LCM_NOT_MIN'}; }
      st.step=1; st.msg=''; paintBeat();
      return {halt:true, tone:'ok', msg:'✔ '+it.a+' 和 '+it.b+' 的最小公倍數是 <b>'+L+'</b>，每 '+L+' 兩邊會一起落地。接著回答題目。'};
    }
    if(it.kind==='track'){
      v=m6num(st.v.ans);
      if(isNaN(v)) return {halt:true, msg:'在框裡填一個數。'};
      if(v===it.ans) return {ok:true};
      return {ok:false, code:'FENCE_END'};
    }
    var pk=[]; for(var g in st.pick) if(st.pick[g]) pk.push(+g);
    if(!pk.length) return {halt:true, msg:'點出在範圍內的數。'};
    return m6same(pk,it.ans) ? {ok:true} : {ok:false, code:'RANGE_PICK'};
  }
  if(it.kind==='cut' || it.kind==='tile'){
    if(st.step===0){
      v=m6num(st.v.side);
      if(isNaN(v)) return {halt:true, msg:'先輸入正方形的邊長。'};
      st.trial=v;
      if(it.kind==='cut'){
        if(it.W%v||it.H%v){ paintBeat(); return {ok:false, code:'GCD_WASTE'}; }
        if(v!==it.ans.s){ paintBeat(); return {ok:false, code:'GCD_NOT_MAX'}; }
      } else {
        if(v%it.W||v%it.H){ paintBeat(); return {ok:false, code:'LCM_TILE'}; }
        if(v!==it.ans.s){ paintBeat(); return {ok:false, code:'LCM_NOT_MIN'}; }
      }
      st.side=v; st.step=1; st.msg=''; paintBeat();
      return {halt:true, tone:'ok', msg:'✔ 邊長 <b>'+v+' cm</b>：'+(it.kind==='cut'?'是 '+it.W+' 和 '+it.H+' 的最大公因數。':'是 '+it.W+' 和 '+it.H+' 的最小公倍數。')+'接著算張數。'};
    }
    v=m6num(st.v.ans);
    if(isNaN(v)) return {halt:true, msg:'在框裡填張數。'};
    return v===it.ans.n ? {ok:true} : {ok:false, code:'CUT_COUNT'};
  }
  if(it.kind==='share'){
    if(st.step===0){
      v=m6num(st.v.kids);
      if(isNaN(v)) return {halt:true, msg:'先輸入人數。'};
      st.trial=v;
      if(v!==it.k){ paintBeat(); return {ok:false, code:'SHARE_GCD'}; }
      st.kids=v; st.step=1; st.msg=''; paintBeat();
      return {halt:true, tone:'ok', msg:'✔ <b>'+v+' 人</b>剛好都分完。接著算每人分到多少。'};
    }
    for(var i=0;i<it.ask.length;i++){
      v=m6num(st.v['a'+i]);
      if(isNaN(v)) return {halt:true, msg:'每一格都要填。'};
      if(v!==it.ask[i].ans) return {ok:false, code:'SHARE_EACH'};
    }
    return {ok:true};
  }
  if(it.kind==='fix'){
    var ad=m6num(st.v.add), sb=m6num(st.v.sub);
    if(isNaN(ad)||isNaN(sb)) return {halt:true, msg:'兩格都要填。'};
    return (ad===it.ans.add && sb===it.ans.sub) ? {ok:true} : {ok:false, code:'FIX_REM'};
  }
  return {halt:true, msg:'？'};
}

  if(it.kind==='tile') return '正解：'+it.W+' 和 '+it.H+' 的最小公倍數是 '+it.ans.s+'，('+it.ans.s+' ÷ '+it.W+') × ('+it.ans.s+' ÷ '+it.H+') ＝ '+it.ans.n+' 張。';
  if(it.kind==='share') return '正解：'+it.A+' 和 '+it.B+' 的公因數裡'+(it.more?'大於 '+it.more+' 的':'最大的')+'是 '+it.k+'，所以 '+it.k+' 人；'
      + it.ask.map(function(q){ return q.lab+' '+q.ans; }).join('，')+'。';

  return '';
}
function sosBeat(it){

      '先找最小公倍數，再一個一個往上加，看哪些落在範圍裡。', '例如 6 和 8 的公倍數：24、48、72… 在 40～80 之間的是 48 和 72。' ];

      '要最大的正方形 → 用最大公因數。可以用短除法找。', '例如 12 × 18：最大公因數 6，(12 ÷ 6) × (18 ÷ 6) ＝ 2 × 3 ＝ 6 張。' ];
  if(it.kind==='tile') return [ '拼成的正方形，邊長要同時是長和寬的<b>倍數</b>。', '要最小的正方形 → 用最小公倍數。',
      '例如用 4 × 6 拼：最小公倍數 12，(12 ÷ 4) × (12 ÷ 6) ＝ 3 × 2 ＝ 6 張。' ];
  if(it.kind==='share') return [ '每人分得一樣多又沒有剩，人數要能整除兩種東西 → 是兩個數的公因數。',
      it.more ? '把公因數全部列出來，挑出符合「超過 '+it.more+' 人」的。' : '「最多」幾人 → 最大公因數。',
      '例如 12 顆糖和 18 塊餅乾，最多分給 6 人，每人 2 顆糖、3 塊餅乾。' ];
  if(it.kind==='fix') return [ '先做除法：'+it.n+' ÷ '+it.d+' ＝ 幾…餘幾？', '減去「餘數」就能整除。',
      '加上「除數 − 餘數」也能整除。例如 100 ÷ 30 ＝ 3…10：減 10 或加 20。' ];
  return [];
}

/* 一條緞帶：寬度表示大小，units 表示畫幾個「1」 */
function m6rib(n,d,units,cls){
  var W=520, pw=W/units, s='', cells=d*units;
  if(d<=0) d=1;
  var fillW=Math.min(n/d,units)*pw;
  s+='<rect x="0" y="4" width="'+W+'" height="26" fill="#fff" stroke="#b9b2d8"/>';
  s+='<rect x="0" y="4" width="'+fillW+'" height="26" class="'+(cls||'m6fill')+'"/>';
  if(cells<=160) for(var i=1;i<cells;i++){ var xx=i*W/cells; s+='<line x1="'+xx+'" y1="4" x2="'+xx+'" y2="30" stroke="#d8d2ee" stroke-width="1"/>'; }
  for(var u=1;u<units;u++) s+='<line x1="'+u*pw+'" y1="0" x2="'+u*pw+'" y2="34" stroke="#2a2250" stroke-width="2"/>';
  return '<svg class="m6rib" viewBox="-2 0 '+(W+4)+' 34" preserveAspectRatio="none">'+s+'</svg>';
}

function judgeRibbon(it){
  var st=G.st, a=st.act; st.act=null;
  if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};

    for(var i=0;i<it.rows.length;i++){
      var c=st.cur[i];
      if(c.n*B[1]!==c.d*B[0]){
        var r=it.rows[i];

        return {ok:false, code:'EQ_SAME'};
      }

  }
  if(it.kind==='add'){
    var nd=it.f[1]+it.addD, want=it.f[0]*nd/it.f[1], v=m6num(st.v.ans);
    if(isNaN(v)) return {halt:true, msg:'把「分子要加上」的框填好。'};
    if(st.cur[0].n!==want) return {ok:false, code:'EQ_SAME'};
    if(v===it.addD) return {ok:false, code:'ADD_SAME'};
    return v===it.ans ? {ok:true} : {ok:false, code:'ADD_SAME'};
  }
  if(it.kind==='between'){
    var d=it.d, lo=it.lo[0]*d/it.lo[1], hi=it.hi[0]*d/it.hi[1];
    if(st.step===0){
      var l=m6num(st.v.lo), h2=m6num(st.v.hi);
      if(isNaN(l)||isNaN(h2)) return {halt:true, msg:'兩個框都要填分子。'};
      if(l!==lo||h2!==hi) return {ok:false, code:'BETW_CONV'};
      st.step=1; st.msg=''; paintRibbon();
      return {halt:true, tone:'ok', msg:'✔ 兩端是 '+lo+'/'+d+' 和 '+hi+'/'+d+'。接著點亮中間的最簡分數。'};
    }
    var pk=[]; for(var k in st.pick) if(st.pick[k]) pk.push(+k);
    if(!pk.length) return {halt:true, msg:'點亮你認為的最簡分數。'};
    var want2=[]; for(var x=lo+1;x<hi;x++) if(m6gcd(x,d)===1) want2.push(x);
    if(m6same(pk,want2)) return {ok:true};
    if(pk.some(function(x){ return x<=lo||x>=hi; })) return {ok:false, code:'BETW_RANGE'};
    if(pk.some(function(x){ return m6gcd(x,d)!==1; })) return {ok:false, code:'BETW_SIMPLE'};
    return {ok:false, code:'BETW_MISS'};
  }
  if(it.kind==='cmp'){
    for(var j=0;j<it.pairs.length;j++) if(!st.cmp[j]) return {halt:true, msg:'每一組都要選 ＜、＝ 或 ＞。'};
    for(j=0;j<it.pairs.length;j++) if(st.cmp[j]!==it.pairs[j].a) return {ok:false, code:it.pairs[j].c};
    return {ok:true};
  }
  if(it.kind==='box'){
    var dd=B[1]*it.top/B[0];
    if(st.step===0){
      if(st.cur[0].d!==dd) return {ok:false, code:'EQ_SAME'};
      st.step=1; st.msg=''; paintRibbon();
      return {halt:true, tone:'ok', msg:'✔ '+B[0]+'/'+B[1]+' ＝ '+it.top+'/'+dd+'。接著想 □ 的範圍。'};
    }
    var v2=m6num(st.v.ans);
    if(isNaN(v2)) return {halt:true, msg:'在框裡填一個數。'};
    if(v2===it.ans) return {ok:true};
    if(v2===dd) return {ok:false, code:'BOX_EQ'};
    return {ok:false, code:'BOX_DIR'};
  }
  return {halt:true, msg:'？'};
}
function answerRibbon(it){
  if(it.kind==='eq') return '正解：依序是 '+it.ans.join('、')+'（'+it.base[0]+'/'+it.base[1]+' 的分子分母同乘或同除以一個數）。';
  if(it.kind==='add'){ var nd=it.f[1]+it.addD; return '正解：'+it.f[1]+' → '+nd+' 是 '+(nd/it.f[1])+' 倍，分子 '+it.f[0]+' × '+(nd/it.f[1])+' ＝ '+(it.f[0]*nd/it.f[1])+'，要加上 '+it.ans+'。'; }
  if(it.kind==='between'){ var d=it.d, lo=it.lo[0]*d/it.lo[1], hi=it.hi[0]*d/it.hi[1], w=[];
    for(var x=lo+1;x<hi;x++) if(m6gcd(x,d)===1) w.push(x+'/'+d);
    return '正解：'+w.join('、')+'，共 '+w.length+' 個。'; }
  if(it.kind==='cmp') return '正解：'+it.pairs.map(function(p){ return ({'<':'＜','=':'＝','>':'＞'})[p.a]; }).join('、')+'（由上到下）。';

}
function sosRibbon(it){

      '例如 2/5 的分母加 10：5 → 15 是 3 倍，分子 2 → 6，要加上 4（不是加 10）。' ];

      '帶分數和假分數，先化成同一種寫法再比。除法 a ÷ b 可以寫成 a/b。' ];
  if(it.kind==='box') return [ '先把 '+it.base[0]+'/'+it.base[1]+' 約分，再擴分成分子是 '+it.top+' 的分數。',

  } else if(it.kind==='poly'){
    h += '<div class="m6polybox"><b>內角和 '+it.sum+'°</b><span>從一個頂點拉對角線 → 切成幾個三角形？每個三角形 180°</span></div>' + m6msg()
       + '<div class="m6ansrow">切成 '+m6in('t',st.v.t,64)+' 個三角形　有 '+m6in('n',st.v.n,64)+' 個角　每個角 '+m6in('e',st.v.e,70)+' 度</div>' + go();
  } else if(it.kind==='hexa'){
    var tri=0; ['C','D','E'].forEach(function(k){ if(st.diag[k]) tri++; });
    h += m6hexSVG(st)
       + '<div class="m6note">'+(st.step===0 ? '點頂點，從 A 拉對角線（已拉 '+tri+' 條）' : '切成 <b>'+(tri+1)+'</b> 個三角形了！')+'</div>' + m6msg()
       + (st.step===1 ? '<div class="m6ansrow">∠A ＝ '+m6in('ans',st.v.ans,70)+' 度</div>'+go() : '');
  } else if(it.kind==='iso'){
    h += m6isoSVG() + m6msg()
       + '<div class="m6ansrow">∠1 ＝ '+m6in('a1',st.v.a1,64)+' 度　∠2 ＝ '+m6in('a2',st.v.a2,64)+' 度</div>' + go();
  } else if(it.kind==='fold'){
    h += '<div class="m6shapes">'+it.shapes.map(function(sp,i){
        var f=st.fold[sp.id], line=f!=null?M6_FOLDS[sp.id][f]:null;
        return '<div class="m6shape">'+m6foldSVG(sp.id,line)+'<div class="m6sn">'+sp.name+'</div>'
          + '<button class="m6chip" data-f="'+sp.id+'"'+(st.done?' disabled':'')+'>📐 試摺</button>'
          + (line?'<div class="m6fv '+(line[4]?'ok':'no')+'">'+(line[4]?'疊合 ✔':'不疊合 ✖')+'</div>':'<div class="m6fv">&nbsp;</div>')
          + '<select class="m6sel" data-s="'+i+'"'+(st.done?' disabled':'')+'><option value="">幾條？</option>'
          + M6_COUNTS.map(function(c){ return '<option'+(st.cnt[i]===c?' selected':'')+'>'+c+'</option>'; }).join('')+'</select></div>';
      }).join('')+'</div>' + m6msg() + go();
  } else if(it.kind==='mirror'){
    h += m6mirrorSVG(st)
       + '<div class="m6note">先點一個頂點，再按要填的格子旁的「放這裡」。</div>'
       + '<div class="m6qs">'
       + '<div>① 點 A 和點 <b class="m6slotv">'+(st.v.qA||'？')+'</b> 疊合 <button class="m6chip" data-q="qA">放這裡</button></div>'
       + '<div>② 邊 HG 和邊 <b class="m6slotv">'+(st.v.qE1||'？')+(st.v.qE2||'？')+'</b> 疊合 <button class="m6chip" data-q="qE1">放第 1 點</button><button class="m6chip" data-q="qE2">放第 2 點</button></div>'
       + '<div>③ ∠1 ＝ '+m6in('ang',st.v.ang,60)+' 度</div>'
       + '<div>④ 若邊 BC ＝ 邊 GF ＝ 4 cm，周長 ＝ '+m6in('per',st.v.per,60)+' cm</div></div>' + m6msg() + go();
  } else if(it.kind==='bar' || it.kind==='line'){
    h += (it.kind==='bar' ? m6barSVG(it, st.ruler) : m6lineSVG(it, st.ruler))
       + '<div class="m6note">在圖上按住左右拖，那條直線就是讀數尺。</div>' + m6msg()
       + '<div class="m6qs">'+it.ask.map(function(q,i){ return '<div>'+q.lab+'：'+m6in('a'+i,st.v['a'+i],80)+'</div>'; }).join('')+'</div>' + go();
  }
  z.innerHTML=h;
  m6bindIn();
  m6on('#zone .m6card', function(b){ if(st.done) return; var i=+b.dataset.i; st.mark[i]=!st.mark[i]; sTap(); paintGeo(); });
  var rb=document.getElementById('m6run');
  if(rb) rb.onclick=function(){
    if(G.frozen||st.trials<=0) return;
    var v=m6num(st.v['try']);
    if(!(v>=1&&v<=500)){ st.msg='先輸入第三根木棒的長度。'; st.msgOk=false; paintGeo(); return; }
    st.trial=v; st.trials--; st.msg=''; sDrop(); paintGeo();
  };
  m6on('#zone .m6chip[data-e]', function(b){
    if(st.done) return; var e=b.dataset.e;
    if(st.order.indexOf(e)<0 && st.order.length<3) st.order.push(e); sTap(); paintGeo();
  });
  var cl=document.getElementById('m6clr'); if(cl) cl.onclick=function(){ if(G.frozen) return; st.order=[]; sTap(); paintGeo(); };
  Array.prototype.forEach.call(document.querySelectorAll('#zone .m6vx'),function(g){
    g.onclick=function(){
      if(G.frozen||st.done) return;
      var k=g.getAttribute('data-k');
      if(it.kind==='hexa'){
        if(st.step!==0) return;
        if(k==='A'){ st.msg='對角線要從 A 拉到別的頂點。'; st.msgOk=false; }
        else if(k==='B'||k==='F'){ st.msg='A 和 '+k+' 相鄰，連起來是<b>邊</b>，不是對角線。'; st.msgOk=false; sWrong(); }
        else { st.diag[k]=true; st.msg=''; sDrop();
          if(st.diag.C&&st.diag.D&&st.diag.E){ st.step=1; st.msg='✔ 從 A 拉了 3 條對角線，六邊形切成 4 個三角形。'; st.msgOk=true; sRight(); } }
        paintGeo(); return;
      }
      if(it.kind==='mirror'){ st.v.pt=k; sTap(); paintGeo(); }
    };
  });
  m6on('#zone .m6chip[data-q]', function(b){
    if(st.done) return;
    if(!st.v.pt){ st.msg='先在圖上點一個頂點。'; st.msgOk=false; paintGeo(); return; }
    st.v[b.dataset.q]=st.v.pt; st.v.pt=null; sTap(); paintGeo();
  });
  m6on('#zone .m6chip[data-f]', function(b){
    if(st.done) return; var id=b.dataset.f, n=M6_FOLDS[id].length;
    st.fold[id] = st.fold[id]==null ? 0 : (st.fold[id]+1)%n; sTap(); paintGeo();
  });
  Array.prototype.forEach.call(document.querySelectorAll('#zone .m6sel'),function(sel){
    sel.onchange=function(){ st.cnt[+sel.dataset.s]=sel.value; };
  });
  var ch=document.getElementById('m6chart');
  if(ch){
    var setX=function(cx){
      var el=document.getElementById('m6chart'); if(!el) return;
      var r=el.getBoundingClientRect(), vb=el.viewBox.baseVal, x=(cx-r.left)/r.width*vb.width;
      var v=Math.round((x-(+el.dataset.x0))/(+el.dataset.sc));
      v=Math.max(0,Math.min(+el.dataset.max,v));
      if(v!==st.ruler){ st.ruler=v; paintGeo(); }
    };
    ch.onpointerdown=function(ev){
      if(G.frozen) return;
      setX(ev.clientX);
      var mv=function(e){ setX(e.clientX); };
      var up=function(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); };
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    };
  }
  var sb=document.getElementById('m6sub');
  if(sb) sb.onclick=function(){ if(G.frozen) return; st.act='submit'; sDrop(); check(); };
}
function judgeGeo(it){
  var st=G.st, a=st.act; st.act=null;
  if(st.done) return {halt:true, msg:'這一題已經完成了，按「下一題」。'};
  if(a!=='submit') return {halt:true, msg:'先操作，再按確定。'};
  var i, v;
  if(it.kind==='tribet'){
    var any=false, good=true;
    it.cards.forEach(function(c,i){ if(st.mark[i]) any=true; if(!!st.mark[i]!==c.ok) good=false; });
    if(!any) return {halt:true, msg:'先點選可以搭成三角形的組合。'};
    return good ? {ok:true} : {ok:false, code:'TRI_SUM'};
  }
  if(it.kind==='stick'){
    var mn=m6num(st.v.mn), mx=m6num(st.v.mx);
    if(isNaN(mn)||isNaN(mx)) return {halt:true, msg:'最小和最大都要填。'};
    return (mn===it.ans[0]&&mx===it.ans[1]) ? {ok:true} : {ok:false, code:'TRI_RANGE'};
  }
  if(it.kind==='side'){
    if(st.order.length<3) return {halt:true, msg:'三個邊都要點，由長到短。'};
    return st.order.join()===it.ans.join() ? {ok:true} : {ok:false, code:'SIDE_ANGLE'};
  }
  if(it.kind==='poly'){
    var t=m6num(st.v.t), n=m6num(st.v.n), e=m6num(st.v.e);
    if(isNaN(t)||isNaN(n)||isNaN(e)) return {halt:true, msg:'三格都要填。'};
    if(t!==it.ans.t||n!==it.ans.n) return {ok:false, code:'POLY_N2'};
    return e===it.ans.each ? {ok:true} : {ok:false, code:'POLY_EACH'};
  }
  if(it.kind==='hexa'){
    if(st.step===0) return {halt:true, msg:'先從 A 拉對角線，把六邊形切成三角形。'};
    v=m6num(st.v.ans);
    if(isNaN(v)) return {halt:true, msg:'填 ∠A 的度數。'};
    return v===it.ans ? {ok:true} : {ok:false, code:'POLY_SUM'};
  }
  if(it.kind==='iso'){
    var a1=m6num(st.v.a1), a2=m6num(st.v.a2);
    if(isNaN(a1)||isNaN(a2)) return {halt:true, msg:'∠1 和 ∠2 都要填。'};
    return (a1===it.ans[0]&&a2===it.ans[1]) ? {ok:true} : {ok:false, code:'ISO'};
  }
  if(it.kind==='fold'){
    for(i=0;i<it.shapes.length;i++) if(!st.cnt[i]) return {halt:true, msg:'每個圖形都要選幾條。'};
    for(i=0;i<it.shapes.length;i++) if(st.cnt[i]!==it.shapes[i].ans) return {ok:false, code:'FOLD_AXIS'};
    return {ok:true};
  }
  if(it.kind==='mirror'){
    if(!st.v.qA||!st.v.qE1||!st.v.qE2) return {halt:true, msg:'①、② 要先點頂點再按「放這裡」。'};
    var ang=m6num(st.v.ang), perV=parseFloat(st.v.per);
    if(isNaN(ang)||isNaN(perV)) return {halt:true, msg:'③、④ 都要填。'};
    var edge=[st.v.qE1,st.v.qE2].sort().join('');
    if(st.v.qA!=='D'||edge!=='EF'||ang!==165||perV!==21) return {ok:false, code:'MIRROR'};
    return {ok:true};
  }
  if(it.kind==='bar' || it.kind==='line'){
    for(i=0;i<it.ask.length;i++){ v=m6num(st.v['a'+i]); if(isNaN(v)) return {halt:true, msg:'每一格都要填。'}; }
    for(i=0;i<it.ask.length;i++) if(m6num(st.v['a'+i])!==it.ask[i].ans) return {ok:false, code:'CHART'};
    return {ok:true};
  }
  return {halt:true, msg:'？'};
}
function answerGeo(it){
  if(it.kind==='tribet') return '正解：可以的是「'+it.cards.filter(function(c){ return c.ok; }).map(function(c){ return c.t; }).join('」「')+'」。';
  if(it.kind==='stick') return '正解：50 − 30 ＜ 第三邊 ＜ 50 ＋ 30，也就是 20 ＜ 第三邊 ＜ 80，整數最小 21、最大 79。';
  if(it.kind==='side') return '正解：∠C ＝ 180 − 50 − 23 ＝ 107°，最大；∠C 對邊 AB 最長，∠A 對邊 BC，∠B 對邊 CA 最短 → AB ＞ BC ＞ CA。';
  if(it.kind==='poly') return '正解：2340 ÷ 180 ＝ 13 個三角形，13 ＋ 2 ＝ 15 個角，每個角 2340 ÷ 15 ＝ 156 度。';
  if(it.kind==='hexa') return '正解：六邊形切成 4 個三角形，內角和 720 度；720 − 120 − 150 − 160 − 90 − 90 ＝ 110 度。';
  if(it.kind==='iso') return '正解：∠B ＝ ∠ACB ＝ (180 − 50) ÷ 2 ＝ 65；CB ＝ CD，∠CDB ＝ ∠B ＝ 65，∠BCD ＝ 50；∠1 ＝ 65 − 50 ＝ 15，∠2 ＝ 180 − 65 ＝ 115。';
  if(it.kind==='fold') return '正解：'+it.shapes.map(function(s){ return s.name+' '+s.ans+' 條'; }).join('、')+'。';
  if(it.kind==='mirror') return '正解：A ↔ D；HG ↔ EF；∠1 ＝ ∠B ＝ 165°；周長 ＝ (2 ＋ 3 ＋ 1.5) × 2 ＋ 4 × 2 ＝ 21 cm。';
  if(it.kind==='bar' || it.kind==='line') return '正解：'+it.ask.map(function(q){ return q.lab+' '+q.ans; }).join('；')+'。';
  return '';
}
function sosGeo(it){
  if(it.kind==='tribet') return [ '三個邊：把兩根短的加起來，要<b>大於</b>最長的（等於也不行）。', '三個角：加起來要剛好 180 度。',
      '例如 5、6、12：5 ＋ 6 ＝ 11 ＜ 12，搭不起來；60°、60°、60°：剛好 180，可以。' ];
  if(it.kind==='stick') return [ '第三邊太短：兩根短的碰不到；太長：攤成一直線。', '第三邊要大於兩邊的「差」、小於兩邊的「和」。',
      '例如兩邊 10 和 4：6 ＜ 第三邊 ＜ 14，整數最小 7、最大 13。' ];
  if(it.kind==='side') return [ '先用 180 度減掉兩個已知的角，算出 ∠C。', '最大的角對面的邊最長，最小的角對面的邊最短。',
      '「對面的邊」：∠A 對面是 BC，∠B 對面是 CA，∠C 對面是 AB。' ];
  if(it.kind==='poly') return [ '內角和 ÷ 180 ＝ 切成幾個三角形。', '三角形個數 ＋ 2 ＝ 邊數（角數）。',
      '例如內角和 1440 度：1440 ÷ 180 ＝ 8 個三角形，8 ＋ 2 ＝ 10 邊形，每個角 1440 ÷ 10 ＝ 144 度。' ];
  if(it.kind==='hexa') return [ '對角線是連「不相鄰」的兩個頂點。從 A 可以連到哪幾點？', '切成幾個三角形，內角和就是幾個 180。',
      '例如五邊形四個角是 100、110、120、90，內角和 540，第五個角 ＝ 540 − 420 ＝ 120。' ];
  if(it.kind==='iso') return [ '△ABC 中 AB ＝ AC，所以 ∠B ＝ ∠ACB。先算它們是幾度。', '△CBD 中 CB ＝ CD，所以 ∠CDB ＝ ∠B，可以求出 ∠BCD。',
      '∠1 ＝ ∠ACB − ∠BCD；∠2 和 ∠CDB 合起來是一直線（180 度）。' ];
  if(it.kind==='fold') return [ '對稱軸：沿著它摺，兩邊要完全疊合。', '正 n 邊形有 n 條對稱軸；圓的每一條直徑都是對稱軸。',
      '平行四邊形（不是長方形、菱形）沿哪裡摺都不會疊合。' ];
  if(it.kind==='mirror') return [ '對稱軸是橫的，上面的點會摺到下面：看同一條垂直線上的點。', '對稱的邊一樣長、對稱的角一樣大。',
      '周長：上半部每一段在下半部都有一樣長的對稱邊，再加上被軸切過的那兩邊。' ];
  if(it.kind==='bar') return [ '拖讀數尺對準每一段長條的尾端，讀出數字。', '女生人數 ＝ 整條的長度 − 藍色（男生）的長度。', '「相差」用減法，「共有」用加法。' ];
  if(it.kind==='line') return [ '讀數尺對準月分，會顯示當月的收入和支出。', '兩條線交在一起的點，收入和支出一樣多。', '相差 ＝ 收入 − 支出，每個月都算一次再比大小。' ];
  return [];
}

/* ============================================================
   玩法登錄表
   ============================================================ */
function m6choice(){ var it=G && G.lv && G.lv.items[G.qi]; return !!(it && it.guess); }
function m6right(icon, paint){
  return function(it){
    G.st.done=true;
    return { msg:'<div class="ans">'+icon+' '+MODES[G.lv.mode].answer(it).replace(/^正解：/,'')+'</div>', after: paint };
  };
}
LEVELS.forEach(function(lv){ lv.items.forEach(function(it){
  /* 猜得到的題型：下注、真假、拔河、排順序 → 答錯停 10 秒 */
  it.guess = /^(bet|truth|cmp|tribet|side)$/.test(it.kind);
}); });

MODES = {
  mine:   { choice:m6choice, noCheck:true,
    sub:function(it){ return {gem:'點石頭→選鑿子敲；你認為是質數的標成 💎', bet:'點石頭下注「敲得開」，再一次敲下去', truth:'點選對的敘述，再按驗證',
      ways:'輸入鑿子大小去敲，找出所有因數對', delta:'先敲出所有因數對，再找 △', rev:'用因數成對的想法推出 N，可以試挖 3 次'}[it.kind]; },
    title:function(it){ return {gem:'找出質數寶石', bet:'敲得開嗎？', truth:'哪些敘述是對的？', ways:'有幾種分法？', delta:'△ 可能是什麼數？', rev:'N 是多少？'}[it.kind]; },
    stage:stageMine, bind:paintMine, judge:judgeMine, answer:answerMine, sos:sosMine, onRight:m6right('⛏️', paintMine) },
  beat:   { choice:false, noCheck:true,
    sub:function(it){ return {track:'先調出同步節拍，再算整條河岸', range:'先調出同步節拍，再挑出範圍裡的數', cut:'先試切找最大正方形，再算張數',
      tile:'先試拼找最小正方形，再算張數', share:'先試分找人數，再算每人分到多少', fix:'用除法的餘數想一想'}[it.kind]; },
    title:function(it){ return {track:'節拍跑道', range:'節拍跑道', cut:'切紙機', tile:'拼紙機', share:'平分機', fix:'整除修正'}[it.kind]; },
    stage:stageBeat, bind:paintBeat, judge:judgeBeat, answer:answerBeat, sos:sosBeat, onRight:m6right('🥁', paintBeat) },
  ribbon: { choice:m6choice, noCheck:true,
    sub:function(it){ return {eq:'用 −／＋ 調空格，讓緞帶跟樣品一樣長', add:'先調出新分數，再填分子要加多少', between:'先換成同分母，再點亮最簡分數',
      cmp:'每一組選 ＜ ＝ ＞，再開拔', box:'先把樣品換成同分子，再想 □ 的範圍'}[it.kind]; },
    title:function(it){ return {eq:'緞帶對齊', add:'分母加大了', between:'點亮最簡分數', cmp:'分數拔河', box:'□ 最大是多少？'}[it.kind]; },
    stage:stageRibbon, bind:paintRibbon, judge:judgeRibbon, answer:answerRibbon, sos:sosRibbon, onRight:m6right('🎀', paintRibbon) },
  geo:    { choice:m6choice, noCheck:true,
    sub:function(it){ return {tribet:'先選，再搭搭看', stick:'可以試搭 3 次，再填答案', side:'先算第三個角，再由長到短點邊', poly:'內角和 ÷ 180 ＝ 幾個三角形',
      hexa:'點頂點，從 A 拉對角線把六邊形切成三角形', iso:'用等腰三角形的底角一步一步推', fold:'試摺看看，再選幾條', mirror:'點頂點回答，再填角度和周長',
      bar:'拖讀數尺讀長條', line:'拖讀數尺讀折線'}[it.kind]; },
    title:function(it){ return {tribet:'搭得成三角形嗎？', stick:'第三根木棒', side:'哪個邊最長？', poly:'正多邊形', hexa:'六邊形的角', iso:'等腰三角形',
      fold:'幾條對稱軸？', mirror:'線對稱圖形', bar:'長條圖', line:'折線圖'}[it.kind]; },
    stage:stageGeo, bind:paintGeo, judge:judgeGeo, answer:answerGeo, sos:sosGeo, onRight:m6right('🏗️', paintGeo) }
};

</script>
<script>GameEngine.start();</script>
