<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數學期中大冒險</title>
<!-- 調色盤：每個單元自己的顏色，放在引擎樣式前面 -->
<style>
:root{
  --brand:#1e2a38; --brand2:#2c3e50; --brandink:#2c3e50;
  --steel:#1e2a38; --steel2:#2c3e50; --amber:#ffb020; --amber2:#e07b00;
  --ink:#16232e; --ok:#2fa46b; --no:#e0603c; --card:#fdf8ef; --line:#dfcfae;
  --pipe:#6b7f92;
  --bg:linear-gradient(180deg,#33506b,#1e2a38 55%,#131c26);
}
body{background:var(--bg)}
</style>
<style>

*{box-sizing:border-box;margin:0;padding:0}
/* 調色盤由單元包提供（:root） */
body{
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  background:linear-gradient(180deg,#33506b,#1e2a38 55%,#131c26);
  color:var(--ink);min-height:100vh;padding:16px;overflow-x:hidden;
}
.wrap{max-width:960px;margin:0 auto;position:relative;z-index:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.topbar{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:14px;flex-wrap:wrap}
.topbar h1{font-size:20px;letter-spacing:1px}
.topbar .sub{font-size:13px;opacity:.7}
.spacer{flex:1}
.chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);
  color:#fff;border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700}
.chip.warn{background:#c0392b;border-color:#e2725b;animation:pulse .8s infinite}
.chip.over{background:rgba(255,176,32,.3);border-color:rgba(255,176,32,.55)}
.chip.btn{cursor:pointer;user-select:none}
@keyframes pulse{50%{opacity:.5}}
.panel{background:var(--card);border-radius:20px;padding:22px;
  box-shadow:0 16px 44px rgba(0,0,0,.42);border:3px solid var(--line);position:relative}
.shake{animation:shk .38s}
@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.flashno::after,.flashok::after{content:"";position:absolute;inset:0;border-radius:18px;
  pointer-events:none;animation:fl .45s ease-out}
.flashno::after{background:rgba(224,96,60,.30)}
.flashok::after{background:rgba(47,164,107,.26)}
@keyframes fl{to{opacity:0}}

/* 選夥伴 */
.pick-head{text-align:center;margin-bottom:16px}
.pick-head .emoji{font-size:46px}
.pick-head h2{font-size:26px;margin:6px 0}
.pick-head p{font-size:15px;color:#4a5d68;line-height:1.7}
.namebar{max-width:430px;margin:0 auto 18px;text-align:center}
.namebar label{display:block;font-size:14px;font-weight:800;color:#8b7a55;margin-bottom:6px}
.namebar input{width:100%;padding:13px 16px;border:3px solid var(--line);border-radius:14px;
  font-size:19px;font-weight:800;text-align:center;font-family:inherit;color:var(--steel2);
  background:#fff;outline:none}
.namebar input:focus{border-color:var(--amber)}
.pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.pet{border:3px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;
  cursor:pointer;transition:.15s;background:#fff}
.pet:hover{transform:translateY(-5px) scale(1.03);border-color:var(--amber)}
.pet.on{border-color:var(--amber);background:#fff3d9;box-shadow:0 0 0 4px rgba(255,176,32,.32)}
.pet .face{font-size:46px;line-height:1.25;display:block}
.pet .nm{font-size:15px;font-weight:800;margin-top:4px;color:var(--steel2)}
.pet-mini{display:inline-flex;align-items:center;gap:5px}
.pet-mini .face{font-size:19px}

/* 工廠地圖 */
.fac-head{text-align:center;margin-bottom:6px}
.fac-head .emoji{font-size:50px;line-height:1.2}
.fac-head h2{font-size:26px;margin:4px 0 6px}
.fac-head p{font-size:15px;color:#4a5d68;line-height:1.7}
.goal{background:#fff3d9;border:2px dashed var(--amber);border-radius:14px;
  padding:12px 16px;margin:14px 0 18px;font-size:15px;line-height:1.7}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.lv{background:#fff;border:3px solid var(--line);border-radius:16px;padding:16px;
  cursor:pointer;transition:.15s;position:relative}
.lv:hover{transform:translateY(-4px);border-color:var(--amber);box-shadow:0 8px 22px rgba(0,0,0,.16)}
.lv.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.7)}
.lv.locked:hover{transform:none;border-color:var(--line);box-shadow:none}
.lv .tier{display:inline-block;font-size:12px;font-weight:800;color:#fff;
  background:var(--steel2);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.lv h3{font-size:19px;margin-bottom:6px}
.lv .desc{font-size:13.5px;color:#5b6b75;line-height:1.6;min-height:44px}
.lv .meta{margin-top:10px;font-size:12.5px;color:#8b7a55;font-weight:700}
.lv .done{margin-top:8px;font-size:12.5px;font-weight:800;color:#14683f;
  background:#e6f7ee;border-radius:8px;padding:4px 8px;display:inline-block}
.lv .stars{position:absolute;top:12px;right:14px;font-size:15px;letter-spacing:1px}
.bonus{margin-top:16px;background:#eef7ff;border:2px solid #a9d3ef;border-radius:14px;
  padding:12px 16px;font-size:14px;line-height:1.7}
.progline{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 16px;
  font-size:14.5px;color:#5b6b75;margin-top:12px;display:inline-block}
.progline b{color:var(--amber2);font-size:16px}

/* 題目框架 */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.qhead .lvname{font-weight:800;color:var(--steel2)}
.qhead .cnt{font-size:14px;color:#7b8b95}
.bar{height:10px;background:#e8ddc4;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.bar > i{display:block;height:100%;border-radius:99px;transition:.35s;
  background:linear-gradient(90deg,var(--amber),var(--amber2));
  box-shadow:0 0 12px rgba(255,176,32,.9)}
.qtext{font-size:clamp(20px,4.2vw,29px);font-weight:800;text-align:center;
  line-height:1.5;margin:6px 0 4px}
.qsub{text-align:center;color:#7b8b95;font-size:14.5px;margin-bottom:14px}
.stage{background:#f7f1e2;border:2px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:16px;position:relative;overflow:hidden}
.buddy{font-size:32px;text-align:center;line-height:1.1}
.buddy.happy{animation:hop .5s ease-out 2}
.buddy.sad{animation:shk2 .4s}
/* 會說話的夥伴（pet().lines）：肖像＋對話框 */
.buddyrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px auto 4px;max-width:560px}
.buddy.talker{font-size:60px;flex:none}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:8px 12px;font-size:15px;line-height:1.5;color:var(--ink);min-height:1.5em}
.bubble:empty{visibility:hidden}
.bubble:before{content:'';position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;
  border-right-color:var(--line);border-left:0}
.bubble b{color:var(--steel2)}
.bubble.pop{animation:bubIn .3s ease-out}
@keyframes bubIn{from{opacity:0;transform:translateX(-8px)}}
.pet .face svg.tch{width:1.6em;height:1.6em}
@media (max-width:560px){ .buddy.talker{font-size:48px} .bubble{font-size:14px} }
@keyframes hop{50%{transform:translateY(-14px) scale(1.14)}}
@keyframes shk2{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.combo{position:absolute;top:8px;right:12px;font-size:22px;font-weight:900;
  color:var(--amber2);text-shadow:0 2px 0 #fff;animation:pop2 .35s ease-out}
@keyframes pop2{from{transform:scale(.4) rotate(-12deg);opacity:0}}

/* L1 積木分類 */
.yard{position:relative;min-height:150px;background:#fffdf7;border:2px dashed var(--line);
  border-radius:12px;margin-bottom:12px;overflow:hidden}
.yard .tip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#b3a headline;color:#b8a887;font-size:15px;font-weight:700}
.blk{position:absolute;border-radius:7px;font-weight:900;display:flex;
  align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;
  box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .12s}
.blk:active{cursor:grabbing;transform:scale(1.12)}
#supply .blk{position:relative;left:auto;top:auto}
.blk.sel{outline:4px solid var(--amber);outline-offset:2px;transform:scale(1.12)}
.blk.k1000{width:74px;height:40px;font-size:15px;background:linear-gradient(160deg,#ffe08a,#f0a800);color:#5a3c00}
.blk.k100{width:58px;height:36px;font-size:14px;background:linear-gradient(160deg,#b8e6ff,#3aa6e0);color:#093246}
.blk.k10{width:44px;height:32px;font-size:13px;background:linear-gradient(160deg,#c9f3c0,#4caf50);color:#0d3d14}
.blk.k1{width:32px;height:30px;font-size:13px;background:linear-gradient(160deg,#ffd0d0,#e0603c);color:#5a1408}
.blk.fly{transition:all .32s cubic-bezier(.4,1.4,.6,1);z-index:5}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.slot2{background:#fff;border:3px solid var(--steel2);border-radius:12px;padding:9px 6px;
  text-align:center;transition:.12s;min-height:96px;cursor:pointer}
.slot2.hot{border-color:var(--amber);background:#fff3d9;transform:scale(1.05)}
.slot2 .lb{font-size:14px;font-weight:800;color:#8b7a55}
.slot2 .cn{font-size:30px;font-weight:900;color:var(--steel2);line-height:1.25;
  font-variant-numeric:tabular-nums}
.slot2 .un{font-size:12px;color:#9aa7b0}
.slot2 .mini{font-size:11px;color:#b8a887;margin-top:2px}
.bignum{font-size:clamp(34px,8vw,54px);font-weight:900;color:var(--steel2);
  letter-spacing:4px;text-align:center;font-variant-numeric:tabular-nums;margin-top:10px}
.bignum.pulse{animation:pop2 .3s ease-out}

.supply{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:8px;
  background:#fffdf7;border:2px dashed var(--line);border-radius:12px;padding:12px 8px}
.sup{display:flex;flex-direction:column;align-items:center;gap:5px}
.blk.ghost{opacity:.85;transform:scale(1.1)}
.supl{font-size:12px;color:#b8a887;font-weight:700}
.slot2.drop{min-height:118px}
.mstack{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:22px;
  align-items:center;margin:3px 0}
.mb{width:13px;height:9px;border-radius:2px;display:inline-block;animation:drop2 .2s ease-out}
.mb.k1000{background:#f0a800}.mb.k100{background:#3aa6e0}
.mb.k10{background:#4caf50}.mb.k1{background:#e0603c}
.more{font-size:11px;color:#9aa7b0;font-weight:800}
@keyframes drop2{from{transform:translateY(-10px);opacity:0}}

/* L2 位值疊卡 */
.rack{display:grid;gap:9px;margin-bottom:14px}
.rrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.rrow .rl{width:44px;font-size:14px;font-weight:800;color:#8b7a55;text-align:right}
.vcard{border:3px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;
  font-size:17px;font-weight:900;color:var(--steel2);cursor:pointer;transition:.12s;
  font-variant-numeric:tabular-nums}
.vcard:hover{transform:translateY(-3px)}
.vcard.on{border-color:var(--amber);background:#ffb020;color:#3a2500;
  box-shadow:0 0 14px rgba(255,176,32,.75)}
.vcard.zero{border-style:dashed;color:#9aa7b0}
.stackbox{background:#fff;border:3px solid var(--steel2);border-radius:14px;padding:14px 10px;
  text-align:center;position:relative;min-height:112px}
.stackbox .lbl{font-size:13px;color:#8b7a55;font-weight:800}
.expand{font-size:16px;font-weight:800;color:#7b8b95;margin-top:6px;
  font-variant-numeric:tabular-nums;min-height:22px}
.stacked{font-size:clamp(32px,7.5vw,48px);font-weight:900;color:var(--amber2);
  letter-spacing:3px;font-variant-numeric:tabular-nums}
.stacked.snap{animation:snapin .28s cubic-bezier(.3,1.6,.6,1)}
@keyframes snapin{from{transform:scale(1.3);filter:blur(2px)}}

/* L3 插卡 */
.qcard{background:#fff;border:3px solid var(--line);border-radius:14px;padding:16px;
  font-size:clamp(17px,3.6vw,22px);font-weight:800;line-height:2.1;text-align:center;
  margin-bottom:14px;color:var(--ink)}
.hole{display:inline-block;min-width:92px;border-bottom:4px solid var(--steel2);
  margin:0 5px;padding:2px 8px;color:var(--amber2);cursor:pointer;
  font-variant-numeric:tabular-nums;transition:.12s}
.hole.on{background:#fff3d9;border-color:var(--amber);border-radius:8px 8px 0 0}
.hole.blank{color:#c9bda0}
.hole.good{color:var(--ok)}
.hole.bad{color:var(--no);animation:shk2 .35s}
.tray{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tcard{border:3px solid var(--line);background:#fff;border-radius:11px;padding:11px 16px;
  font-size:18px;font-weight:900;color:var(--steel2);cursor:pointer;transition:.12s;
  font-variant-numeric:tabular-nums}
.tcard:hover{transform:translateY(-3px);border-color:var(--amber)}
.tcard:active{transform:scale(.94)}
.tcard.used{opacity:.35;pointer-events:none}

/* L4 換鈔機 */
.vault{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}
.bay{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.bay .nm{font-size:14px;font-weight:800;color:#8b7a55}
.bay .stackv{min-height:62px;display:flex;flex-direction:column-reverse;align-items:center;
  gap:2px;justify-content:flex-start;padding:5px 0}
.note{width:100%;max-width:74px;height:11px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.25);
  animation:drop2 .22s ease-out}
@keyframes drop2{from{transform:translateY(-12px) scaleX(.6);opacity:0}}
.note.k1000{background:linear-gradient(90deg,#ffd24a,#e07b00)}
.note.k100{background:linear-gradient(90deg,#8fd4f7,#2b8fc7)}
.note.k10{background:linear-gradient(90deg,#a9e6a0,#3f9b45)}
.note.k1{background:linear-gradient(90deg,#f5b3a4,#c94f2c)}
.bay .cnt2{font-size:26px;font-weight:900;color:var(--steel2);font-variant-numeric:tabular-nums}
.bay .ops{display:flex;gap:5px;margin-top:6px}
.bay .ops button{flex:1;border:none;border-radius:8px;padding:9px 0;font-size:13px;
  font-weight:800;font-family:inherit;cursor:pointer;background:#e3ecf2;color:var(--steel2)}
.bay .ops button:disabled{opacity:.3;cursor:not-allowed}
.bay .ops .brk{background:#ffe6c2;color:#8a4b00}
.bay .ops .mrg{background:#d9f0e2;color:#136b43}
.bay.flash{animation:bayflash .5s}
@keyframes bayflash{0%,100%{background:#fff}35%{background:#fff3d9}}
.payzone{background:#fff;border:3px dashed var(--ok);border-radius:14px;padding:12px;
  text-align:center;margin-top:10px}
.payzone .amt{font-size:30px;font-weight:900;color:var(--ok);font-variant-numeric:tabular-nums}
.opnote{text-align:center;font-size:14.5px;color:#7b8b95;margin-top:10px;line-height:1.7}
.goalbox{background:#eef4ff;border:2px solid #7ba7e0;color:#1c4380;border-radius:12px;
  padding:10px 14px;font-size:14.5px;line-height:1.7;margin-bottom:12px;text-align:center}

.modal{position:fixed;inset:0;background:rgba(18,28,38,.6);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:22px;
  max-width:470px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop3 .18s ease-out}
.mbox h3{font-size:21px;text-align:center;margin-bottom:4px}
.mbox .msub{text-align:center;font-size:14px;color:#7b8b95;margin-bottom:14px}
.mtxt{font-size:15.5px;line-height:1.8;color:#5b6b75;text-align:center;margin-bottom:6px}
.mbox .ptrow:last-child{border-bottom:none}
.estbig{text-align:center;font-size:34px;font-weight:900;color:var(--amber2);margin:12px 0 2px}
.estsub{text-align:center;font-size:13.5px;color:#8b7a55;margin-bottom:6px}

.predict{background:#eef4ff;border:2px solid #7ba7e0;border-radius:14px;padding:13px 15px;margin-bottom:12px}
.predict.locked{opacity:.5;pointer-events:none}
.phead{font-size:14.5px;color:#1c4380;margin-bottom:10px;text-align:center}
.pq{margin-bottom:10px}
.pq:last-child{margin-bottom:0}
.pql{font-size:16px;font-weight:800;color:#16232e;margin-bottom:7px;text-align:center}
.popts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.popt{border:3px solid #b9d3ee;background:#fff;border-radius:12px;padding:11px 20px;
  font-size:19px;font-weight:900;color:var(--steel2);cursor:pointer;font-family:inherit;
  font-variant-numeric:tabular-nums;transition:.12s}
.popt:hover{transform:translateY(-3px);border-color:var(--amber)}
.popt:active{transform:scale(.94)}
.popt.on{border-color:var(--amber);background:var(--amber);color:#472e00;
  box-shadow:0 0 14px rgba(255,176,32,.7)}
.vault.locked{opacity:.42;pointer-events:none;filter:grayscale(.55)}
.lockbar{text-align:center;font-size:14.5px;color:#7b8b95;margin-top:10px;
  background:#f1f0ea;border:2px dashed #ddd6c2;border-radius:10px;padding:9px 12px}

.chip.hit{background:#c0392b;border-color:#e2725b;animation:hitsh .55s}
@keyframes hitsh{20%{transform:translateX(-5px) scale(1.1)}60%{transform:translateX(5px) scale(1.1)}}
.floatpen{position:fixed;font-size:26px;font-weight:900;color:#ff7a5c;z-index:90;
  pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.45);animation:floatup 1s ease-out forwards}
@keyframes floatup{to{transform:translateY(-46px);opacity:0}}
.stage.frozen{pointer-events:none;opacity:.5;filter:grayscale(.45)}
.penline{background:#c0392b;color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:9px;
  font-size:15.5px;text-align:center;animation:pop3 .2s ease-out}
.freezebar{margin-top:10px;text-align:center;font-size:15.5px;font-weight:800;color:#8f3418;
  background:#fff;border:2px dashed #e0603c;border-radius:10px;padding:8px 12px}
.freezebar.done{color:#14683f;border-color:var(--ok);border-style:solid}

.chip.done{background:#2fa46b;border-color:#7fd6a8}
.warnbox{background:#fdeee9;border:2px solid var(--no);color:#8f3418;border-radius:12px;
  padding:12px 15px;font-size:15px;line-height:1.75;margin-bottom:14px;text-align:center}
.finalbar{background:#e6f7ee;border:2px solid var(--ok);color:#14683f;border-radius:14px;
  padding:14px 18px;margin-top:16px;font-size:15.5px;line-height:1.8;text-align:center}
.btn.stop{background:#c0392b;color:#fff}
.alertbar{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:95;
  background:#c0392b;color:#fff;font-size:15px;font-weight:800;padding:11px 20px;
  border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.4);animation:pop3 .2s ease-out}

/* 回饋 */
.fb{border-radius:14px;padding:14px 18px;margin-bottom:14px;font-size:16px;line-height:1.75;
  animation:pop3 .2s ease-out}
@keyframes pop3{from{transform:scale(.96);opacity:0}}
.fb.ok{background:#e6f7ee;border:2px solid var(--ok);color:#14683f}
.fb.no{background:#fdeee9;border:2px solid var(--no);color:#8f3418}
.code{display:inline-block;font-size:12px;font-weight:800;background:rgba(0,0,0,.08);
  border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.fb .ans{margin-top:6px;font-weight:800}
.hintbox{background:#fff8e3;border-left:5px solid var(--amber);border-radius:8px;
  padding:11px 15px;font-size:14.5px;line-height:1.7;margin-bottom:14px;color:#6b5720}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:14px 30px;font-size:17px;font-weight:800;
  cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.main{background:var(--amber);color:#472e00}
.btn.go{background:var(--ok);color:#fff}
.btn.ghost{background:#e6ebee;color:#456}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 結算 / 排行榜 / 匯出 */
.rhead{text-align:center;margin-bottom:16px}
.rhead .emoji{font-size:54px}
.rhead h2{font-size:26px;margin:6px 0}
.rstats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.stat{background:#f7f1e2;border:2px solid var(--line);border-radius:14px;
  padding:12px 20px;text-align:center;min-width:104px}
.stat b{display:block;font-size:28px;color:var(--steel2);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:#7b8b95}
.stat.pt{background:#fff3d9;border-color:var(--amber)}
.stat.pt b{color:var(--amber2)}
.ptbox{background:#fff3d9;border:2px solid var(--amber);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.ptbox h4{font-size:16px;margin-bottom:8px;color:#7a5400}
.ptrow{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;
  padding:6px 0;border-bottom:1px dashed #e6cf95;color:#6b5720}
.ptrow:last-child{border:none;font-weight:900;color:#7a5400;font-size:16.5px;padding-top:9px}
.remember{background:#fff3f0;border:2px solid #f3b6a3;border-radius:14px;padding:14px 18px}
.remember h4{color:#8f3418;margin-bottom:8px;font-size:16px}
.remember li{margin:7px 0 7px 20px;font-size:14.8px;line-height:1.7;color:#6d3a26}
.allgood{background:#e6f7ee;border:2px solid var(--ok);border-radius:14px;
  padding:14px 18px;color:#14683f;font-size:15px;line-height:1.7}
.tablewrap{overflow-x:auto}
.sheet{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.sheet th{background:var(--steel2);color:#fff;padding:10px 8px;font-size:14px;white-space:nowrap}
.sheet td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet td.nm{text-align:left;font-weight:800;color:var(--steel2)}
.sheet tr:nth-child(even) td{background:#f7f1e2}
.sheet .pts{font-weight:900;color:var(--amber2)}
.sheet .miss{color:#c7bda4}
.sheet td.rk{font-size:19px;font-weight:900;color:var(--amber2);width:64px}
.sheet tr.me td{background:#fff3d9 !important;box-shadow:inset 0 0 0 2px var(--amber)}
.youtag{font-size:12px;font-weight:800;background:var(--amber);color:#472e00;
  border-radius:6px;padding:1px 7px;margin-left:4px}
.mode{border-radius:12px;padding:11px 16px;font-size:14.5px;line-height:1.7;margin-bottom:14px;
  background:#f1f0ea;border:2px solid #ddd6c2;color:#5b6b75}
.mode.on{background:#e6f7ee;border-color:var(--ok);color:#14683f}
.codebar{display:flex;gap:8px;flex-wrap:wrap}
.codebar input{flex:1;min-width:210px;padding:11px 14px;border:2px solid var(--line);
  border-radius:11px;font-size:14px;font-family:inherit;background:#fff;outline:none;color:#5b6b75}
.grand{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.rank{text-align:center;background:linear-gradient(160deg,#fff3d9,#ffe3ac);
  border:3px solid var(--amber);border-radius:18px;padding:18px;margin-bottom:14px}
.rank .big{font-size:42px;font-weight:900;color:var(--amber2);line-height:1.2}
.rank .ttl{font-size:20px;font-weight:900;color:#7a5400;margin-top:4px}
.rank .sub{font-size:14px;color:#8b7a55;margin-top:6px;line-height:1.7}
.segbar{display:flex;gap:10px;justify-content:center;margin:16px 0 18px;flex-wrap:wrap}
.seg{border:3px solid var(--line);background:#fff;border-radius:12px;padding:11px 22px;
  font-size:15.5px;font-weight:800;font-family:inherit;color:#7b8b95;cursor:pointer}
.seg.on{border-color:var(--amber);background:#fff3d9;color:#7a5400}
.printhead{display:none;text-align:center;margin-bottom:14px}
.printhead h2{font-size:21px;margin-bottom:4px}
.printhead .sub{font-size:13px;color:#666}
.statline{margin-top:14px;font-size:14.5px;color:#5b6b75;text-align:center;line-height:1.9}
.statline b{color:var(--steel2);font-size:17px}
.signline{display:none;margin-top:26px;font-size:14px;color:#333;text-align:right}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
@media print{
  @page{ margin:12mm; }
  body{background:#fff;padding:0;color:#000}
  .topbar,.actions,.noprint,.mode,.ptbox,.bonus,.rhead,#fx{display:none !important}
  .panel{box-shadow:none;border:none;padding:0;background:#fff}
  .printhead,.signline{display:block}
  .tablewrap{overflow:visible}
  .sheet{font-size:12.5px}
  .sheet th{background:#e8e8e8 !important;color:#000 !important;border:1px solid #999;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet td{border:1px solid #bbb;padding:6px 5px}
  .sheet tr:nth-child(even) td{background:#f6f6f6 !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet tr.me td{background:#fff !important;box-shadow:none}
  .sheet .pts,.sheet td.rk{color:#000 !important}
  .statline{color:#000;border-top:1px solid #999;padding-top:8px}
  tr{page-break-inside:avoid}
  thead{display:table-header-group}
}


/* ===== L1 搶貨對決（duel） ===== */
.duelbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px;
  font-size:15.5px;font-weight:800;color:var(--steel2)}
.duelbar .dside{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 16px}
.duelbar .dside b{font-size:20px;color:var(--amber2)}
.duelbar .dvs{font-size:15px;color:#9aa7b0;font-weight:900}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.dcard{background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px 10px;
  text-align:center;cursor:pointer;transition:.14s}
.dcard:hover{border-color:var(--amber);transform:translateY(-3px)}
.dcard.done{cursor:default;transform:none}
.dcard.win{border-color:var(--ok);background:#e9f9f0;box-shadow:0 0 0 4px rgba(47,164,107,.25)}
.dcard.lose{border-color:var(--no);background:#fdeee9;box-shadow:0 0 0 4px rgba(224,96,60,.22)}
.dlab{font-size:14px;font-weight:800;color:#8b7a55;margin-bottom:8px}
.dslots{display:flex;gap:5px;justify-content:center}
.dslot{width:44px;height:58px;border-radius:10px;background:linear-gradient(160deg,#5b7186,#3a4c5e);
  color:#fff;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;transition:.2s}
.dslot.open{background:#fff;color:var(--steel2);border:3px solid var(--line);
  animation:dflip .26s ease-out}
.dslot.open.none{background:transparent;border:3px dashed #cfc3a8;color:transparent;
  position:relative}
.dslot.open.none::after{content:'沒有';position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);font-size:11px;font-weight:800;color:#b8a887;letter-spacing:1px}
.dslot.open.key{border-color:var(--amber);background:#fff3d9;color:var(--amber2);
  box-shadow:0 0 12px rgba(255,176,32,.6)}
@keyframes dflip{from{transform:rotateY(90deg) scale(.8);opacity:.2}}
.dpick{margin-top:9px;font-size:13px;font-weight:800;color:#9aa7b0}
.dcard:hover .dpick{color:var(--amber2)}
.dmid{text-align:center}
.dcmp{font-size:34px;font-weight:900;color:#c9bda0;min-width:46px}
.dcmp.on{color:var(--amber2);animation:pop3 .25s ease-out}
.dcmp.same{font-size:20px;color:#9aa7b0}
.dctl{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.dreward{font-size:14.5px;color:#6b5720;background:#fff3d9;border:2px solid var(--amber);
  border-radius:10px;padding:6px 14px}
.dreward b{font-size:16px;color:var(--amber2)}
.dnote{text-align:center;font-size:13.5px;color:#9aa7b0;margin-top:10px;line-height:1.7}
@media (max-width:560px){
  .dslot{width:36px;height:48px;font-size:21px}
  .duel{grid-template-columns:1fr auto 1fr;gap:5px}
}


/* ===== 名次播報 ===== */
.ticker{border-radius:12px;padding:11px 16px;margin-bottom:12px;font-size:16px;font-weight:800;
  text-align:center;background:#eef4ff;border:2px solid #7ba7e0;color:#1c4380;
  animation:tickin .32s cubic-bezier(.3,1.5,.6,1)}
.ticker.up{background:#e6f7ee;border-color:var(--ok);color:#14683f}
.ticker.down{background:#fdeee9;border-color:var(--no);color:#8f3418}
@keyframes tickin{from{transform:translateY(-12px) scale(.94);opacity:0}}
.mv{display:inline-block;font-size:12px;font-weight:900;margin-left:5px;vertical-align:3px;
  border-radius:6px;padding:1px 5px}
.mv.up{background:#e6f7ee;color:#14683f}
.mv.down{background:#fdeee9;color:#b6412a}
.sheet tr.rowup td{animation:rowup .9s ease-out}
.sheet tr.rowdown td{animation:rowdown .9s ease-out}
@keyframes rowup{0%{background:#c9f3dc}100%{}}
@keyframes rowdown{0%{background:#ffd9cd}100%{}}
.chase{background:#fff3d9;border:2px solid var(--amber);border-radius:12px;
  padding:11px 16px;margin-bottom:12px;font-size:15.5px;text-align:center;color:#6b5720}
.chase b{font-size:19px;color:var(--amber2)}
.chase.lead{background:#e6f7ee;border-color:var(--ok);color:#14683f}
.chase.lead b{color:#14683f}

.dcmp.ready{font-size:15px;color:var(--amber2);line-height:1.25;animation:pop3 .25s ease-out}
.dcmp .cantell{display:inline-block;font-weight:900}
.dreward.warn{background:#fdeee9;border-color:var(--no);color:#8f3418}
.dreward.warn b{color:#b6412a}


/* ===== L2 裝箱湊單 ===== */
.order{background:#fff3d9;border:2px solid var(--amber);border-radius:12px;padding:11px 16px;
  text-align:center;font-size:16.5px;margin-bottom:12px;color:#6b5720}
.order b{font-size:22px;color:var(--amber2)}
.ordersub{font-size:14px;color:#8b7a55}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-bottom:12px}
.goods{border:3px solid var(--line);background:#fff;border-radius:14px;padding:11px 6px;
  font-family:inherit;font-size:15px;cursor:pointer;color:var(--steel2);transition:.13s}
.goods .gicon{display:block;font-size:24px}
.goods b{font-size:19px;font-variant-numeric:tabular-nums}
.goods:hover{transform:translateY(-3px);border-color:var(--amber)}
.goods.on{border-color:var(--ok);background:#e9f9f0;box-shadow:0 0 0 3px rgba(47,164,107,.25)}
.boxrow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.bcell{background:#fff;border:3px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center}
.bcell.full{border-color:var(--no);background:#fdeee9;animation:pulse .9s infinite}
.blab{font-size:13.5px;font-weight:800;color:#8b7a55}
.bstack{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:24px;align-items:center;margin:4px 0}
.bcnt{font-size:24px;font-weight:900;color:var(--steel2);font-variant-numeric:tabular-nums}
.packbtn{margin-top:5px;width:100%;border:none;border-radius:8px;padding:7px 0;font-size:13px;
  font-weight:800;font-family:inherit;cursor:pointer;background:var(--ok);color:#fff}
.boxsum{text-align:center;font-size:17px;font-weight:800;color:var(--steel2);margin-top:12px}
.boxsum b{font-size:26px;color:var(--amber2);font-variant-numeric:tabular-nums}

/* ===== L3 收銀找零（直式借位） ===== */
.colwrap{display:flex;justify-content:center;margin:6px 0 14px}
.colsum{border-collapse:collapse;font-variant-numeric:tabular-nums}
.colsum td{width:52px;height:46px;text-align:center;font-size:30px;font-weight:900;color:var(--steel2)}
.colsum .markrow td{height:24px;font-size:17px;color:var(--no)}
.bmark{color:var(--no);font-weight:900}
.colsum .toprow td.struck{position:relative;color:#b8b0a0}
.colsum .toprow td.struck::after{content:'';position:absolute;left:12%;right:12%;top:52%;
  height:3px;background:var(--no);transform:rotate(-14deg)}
.colsum td.cur{background:#fff3d9;border-radius:8px;box-shadow:0 0 0 3px var(--amber) inset}
.colsum .botrow td{border-bottom:4px solid var(--steel2)}
.colsum td.sign{font-size:26px;color:var(--steel2)}
.colsum .resrow td.got{color:var(--ok);animation:pop3 .25s ease-out}
.stepq{text-align:center;font-size:17px;font-weight:800;margin-bottom:10px;color:var(--ink)}
.stepnum{color:var(--amber2);font-size:21px;font-variant-numeric:tabular-nums;margin:0 4px}
.stepbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stepdone{text-align:center;font-size:18px;font-weight:800;color:#14683f;
  background:#e6f7ee;border:2px solid var(--ok);border-radius:12px;padding:12px}
.stepdone b{font-size:26px}

/* ===== L4 一日營業 ===== */
.wallet{text-align:center;font-size:16px;font-weight:800;color:#6b5720;background:#fff3d9;
  border:2px solid var(--amber);border-radius:999px;padding:8px 18px;display:block;margin:0 auto 12px;
  max-width:260px}
.wallet b{font-size:23px;color:var(--amber2);font-variant-numeric:tabular-nums}
.event{text-align:center;font-size:16px;color:#5b6b75;margin-bottom:12px;line-height:1.7}
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quote{border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;
  font-family:inherit;cursor:pointer;transition:.13s}
.quote:hover{transform:translateY(-3px);border-color:var(--amber)}
.qn{font-size:14.5px;font-weight:800;color:#8b7a55}
.qp{font-size:28px;font-weight:900;color:var(--steel2);font-variant-numeric:tabular-nums;margin:5px 0}
.qh{font-size:13px;color:#9aa7b0;font-weight:800}
.ledger{background:#fff;border:3px solid var(--line);border-radius:14px;padding:16px;text-align:center;
  margin-bottom:12px}
.lexpr{font-size:27px;font-weight:900;color:var(--steel2);font-variant-numeric:tabular-nums}
.lexpr .lshown{color:var(--amber2)}
.lsub{font-size:14px;color:#9aa7b0;margin-top:6px}
.placeask{text-align:center;font-size:15.5px;font-weight:800;color:#8f3418;margin:12px 0 8px}
.placerow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pbtn{border:3px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;
  font-family:inherit;cursor:pointer;transition:.13s}
.pbtn:hover{border-color:var(--amber);transform:translateY(-2px)}
.pbtn .pl{display:block;font-size:12.5px;color:#8b7a55;font-weight:800}
.pbtn b{font-size:24px;color:var(--steel2);font-variant-numeric:tabular-nums}

.trybar{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.trynote{font-size:13.5px;color:#9aa7b0}

/* =====================================================================
   2B 遺跡探險隊
   ===================================================================== */
.story{background:#fffdf6;border:2px dashed #cdb88a;border-radius:14px;padding:12px 16px;
  font-size:18px;line-height:1.75;color:var(--ink);margin-bottom:14px;font-weight:700}

/* ----- L1 天平機關門 ----- */
.gate{text-align:center;font-size:40px;line-height:1;margin-bottom:4px;transition:.4s}
.gate.open{transform:scale(1.25);filter:drop-shadow(0 0 12px #ffd76a)}
.scale{position:relative;padding-top:6px}
.scale .beam{position:relative;height:10px;border-radius:6px;background:linear-gradient(#8a6a3a,#5d4523);
  margin:0 8% 0;transform-origin:50% 50%;transition:transform .5s}
.scale .beam::after{content:'';position:absolute;left:50%;top:10px;width:0;height:0;
  border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:22px solid #5d4523;
  transform:translateX(-50%)}
.scale.wobble .beam{animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.scale.open .beam{transform:rotate(0);background:linear-gradient(#ffd76a,#d49a1a)}
.pans{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:30px}
.pan{border:3px solid #bfa575;background:#fff;border-radius:0 0 26px 26px;padding:10px;
  min-height:120px;cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
  justify-content:center;transition:.15s}
.pan:hover{border-color:var(--amber);background:#fffaf0}
.scale.open .pan{border-color:var(--ok);background:#effaf3;cursor:default}
.panlab{width:100%;text-align:center;font-size:15px;color:#6b5720;font-weight:800}
.panlab b{color:var(--amber2);font-size:17px}
.panlab small{display:block;font-size:12.5px;color:#9aa7b0;font-weight:700}
.wslot{flex:1 1 110px;max-width:160px;min-height:66px;border:2px dashed #d8c9a5;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:#c2b28c;font-size:13px;font-weight:800}
.weight{flex:1 1 110px;max-width:170px;min-height:66px;border:3px solid #7d6a4a;
  background:linear-gradient(#f3ecdc,#dccfb2);border-radius:12px 12px 16px 16px;padding:6px 8px;
  font-family:inherit;cursor:pointer;transition:.13s;color:var(--steel2)}
.weight:hover{transform:translateY(-3px)}
.weight .wl{display:block;font-size:13px;font-weight:800;color:#6b5720}
.weight b{font-size:24px;font-variant-numeric:tabular-nums}
.weight .wu{font-size:13px;font-weight:800}
.weight.unknown{border-color:var(--amber2);background:linear-gradient(#fff3d9,#ffd98a)}
.weight.sel{box-shadow:0 0 0 4px var(--amber);transform:translateY(-4px)}
.traylab{text-align:center;font-size:15px;font-weight:800;color:#8f3418;margin:14px 0 8px}
.wtray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:10px}

/* ----- L2 迷霧射靶 ----- */
.nline{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;opacity:.55}
.nline.active{opacity:1;border-color:var(--amber);box-shadow:0 0 0 3px #ffe3a3}
.nline.done{opacity:1;border-color:var(--ok)}
.nlab{text-align:center;font-size:17px;font-weight:800;color:var(--steel2);margin-bottom:6px}
.nlab b{font-size:22px;color:var(--amber2);font-variant-numeric:tabular-nums}
.nline.done .nlab b{color:var(--ok)}
.ntrack{position:relative;height:50px;margin:0 36px 26px;border-bottom:4px solid var(--steel2)}
.ntick{position:absolute;bottom:-26px;font-size:14px;font-weight:800;color:#5b6b75;transform:translateX(-50%)}
.ntick.l{left:0}.ntick.r{left:100%}
.ntrack::before,.ntrack::after{content:'';position:absolute;bottom:-10px;width:4px;height:16px;background:var(--steel2)}
.ntrack::before{left:-2px}.ntrack::after{right:-2px}
.nmid{position:absolute;left:50%;bottom:-6px;width:2px;height:10px;background:#9aa7b0}
.ndot{position:absolute;bottom:10px;transform:translateX(-50%);background:var(--amber);color:#3b2a00;
  font-weight:900;font-size:14px;border-radius:10px;padding:3px 7px;white-space:nowrap;transition:left .6s}
.ndot::after{content:'';position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
  border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--amber)}
.ndot.snapL{left:0 !important;background:var(--ok);color:#fff}
.ndot.snapR{left:100% !important;background:var(--ok);color:#fff}
.ndot.snapL::after,.ndot.snapR::after{border-top-color:var(--ok)}
.nends{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.nend{border:3px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-family:inherit;
  font-size:15px;font-weight:800;color:var(--steel2);cursor:pointer;transition:.13s}
.nend:hover:not(:disabled){border-color:var(--amber);transform:translateY(-2px)}
.nend:disabled{opacity:.4;cursor:default}
.eqn{text-align:center;font-size:26px;font-weight:900;color:var(--steel2);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.eqn b{color:var(--ok)}
.range{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-radius:16px;padding:10px;
  background:linear-gradient(#e8eef2,#d5dee4)}
.fogcover{position:absolute;inset:0;border-radius:16px;background:rgba(214,222,228,.93);z-index:2;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  font-size:16px;font-weight:800;color:#5b6b75}
.target{border:3px solid #c9b894;background:#fff;border-radius:50%;aspect-ratio:1;max-width:130px;width:100%;
  margin:0 auto;font-family:inherit;cursor:pointer;transition:.13s;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.target .ring{font-size:28px;line-height:1}
.target b{font-size:22px;color:var(--steel2);font-variant-numeric:tabular-nums}
.target:hover:not(:disabled){transform:scale(1.06);border-color:var(--no)}
.target:disabled{cursor:default}
.target.hit{border-color:var(--ok);background:#e6f7ee;box-shadow:0 0 0 5px #bfe8cf}

/* ----- L3 切礦石 ----- */
.orewrap{margin-bottom:10px}
.ore{position:relative;display:flex;flex-direction:column;border:3px solid #5a4a3a;border-radius:10px;overflow:hidden;
  background-color:#9b8a78;
  background-image:linear-gradient(to right,rgba(40,28,18,.3) 1px,transparent 1px);
  background-size:calc(100% / var(--n)) 100%}
.orow{flex:1;border-bottom:2px solid rgba(40,28,18,.5)}
.ore .orow:last-of-type{border-bottom:0}
.otick{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#ffe08a;opacity:.85}
.orecap{text-align:center;font-size:15px;font-weight:800;color:#5b6b75;margin-top:6px}
.orecap b{color:var(--amber2);font-size:18px}
.orepieces{display:flex;gap:18px;align-items:stretch}
.ore.piece{min-width:0}
.ore.piece.cur{border-color:var(--amber);box-shadow:0 0 0 4px #ffe3a3}
.ore.piece.mined{background-color:#6fb88c;border-color:var(--ok)}
.ore.piece.empty{background:repeating-linear-gradient(45deg,#f1ece2,#f1ece2 6px,#e3dccd 6px,#e3dccd 12px);
  border-style:dashed;border-color:#b3a58b}
.plab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:17px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);line-height:1.3;padding:2px}
.ore.piece.empty .plab{color:#7a6d55;text-shadow:none;font-size:13px}
.askq{text-align:center;font-size:18px;font-weight:800;color:#8f3418;margin:12px 0 8px}
.askq.done{color:#14683f;background:#e6f7ee;border:2px solid var(--ok);border-radius:12px;padding:10px}
.askq.done b{font-size:26px}
.optrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opt{border:3px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-family:inherit;
  font-size:19px;font-weight:900;color:var(--steel2);cursor:pointer;transition:.13s;font-variant-numeric:tabular-nums}
.opt:hover{border-color:var(--amber);transform:translateY(-2px)}
.opt.cutopt{font-size:16px}

/* ----- L4 密碼石碑 ----- */
.knockhint{text-align:center;font-size:16px;font-weight:800;color:#5b6b75;margin-bottom:12px;line-height:1.6}
.knockhint b{color:var(--amber2);font-size:19px}
.knockhint.win{color:#14683f}
.stones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stone{border:3px solid #6f6a60;background:linear-gradient(#cfc9bd,#a39c8e);border-radius:22px 22px 14px 14px;
  padding:12px 4px;font-family:inherit;cursor:pointer;transition:.13s;display:flex;flex-direction:column;
  align-items:center;gap:2px;color:#2b2b2b;min-height:112px;justify-content:center}
button.stone:hover{transform:translateY(-3px) rotate(-2deg);border-color:var(--no)}
.stone span{font-size:26px;line-height:1}
.stone b{font-size:24px;font-variant-numeric:tabular-nums}
.stone small{font-size:12px;color:#7a2e18;font-weight:800}
.stone.gone{opacity:.45;background:#eee8dc;border-style:dashed;cursor:default}
.stone.gone s{font-size:20px;color:#8a8070}
.stone.win{border-color:var(--amber2);background:linear-gradient(#fff3d9,#ffd98a);box-shadow:0 0 0 5px #ffe3a3}
@media (max-width:560px){
  .pans{grid-template-columns:1fr}
  .stones{grid-template-columns:repeat(2,1fr)}
  .ntrack{margin:0 26px 26px}
  .story{font-size:16.5px}
}

/* =====================================================================
   1-1 萬數寶藏島（由舊版單檔移植，class 加上 k 前綴避免與其他單元衝突）
   ===================================================================== */
.kblocks{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
  min-height:104px;align-items:center}
.kempty{color:#b8a887;font-size:15px}
.kblk{width:74px;height:46px;border-radius:8px;color:#5a3c00;font-weight:900;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#ffdd7a,var(--amber) 55%,var(--amber2));
  box-shadow:0 4px 0 #a86e00;animation:pop3 .22s ease-out}
.kcounter{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.krnd{width:56px;height:56px;border-radius:50%;border:none;font-size:28px;font-weight:900;
  background:var(--steel2);color:#fff;cursor:pointer;box-shadow:0 4px 0 #072f42;font-family:inherit}
.krnd:active{transform:translateY(3px);box-shadow:0 1px 0 #072f42}
.krnd:disabled{opacity:.35;cursor:not-allowed}
.kreadout{font-size:15px;color:#5b6b75;text-align:center;margin-top:12px}
.kbignum{font-size:clamp(38px,9vw,60px);font-weight:900;color:var(--steel2);
  letter-spacing:4px;text-align:center;font-variant-numeric:tabular-nums}
.kboard{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.kcol{width:88px;text-align:center}
.kcol .klab{font-size:15px;font-weight:800;color:#8b7a55;margin-bottom:6px}
.kcol .kval{height:76px;border:3px solid var(--steel2);border-radius:12px;background:#fff;
  font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;
  color:var(--steel2);font-variant-numeric:tabular-nums}
.kcol .kbtns{display:flex;gap:6px;margin-top:6px}
.kcol .kbtns button{flex:1;height:34px;border:none;border-radius:8px;background:#dceaf1;
  font-size:19px;font-weight:900;color:var(--steel2);cursor:pointer;font-family:inherit}
.kcol .kbtns button:active{background:#c0dceb}
.kkeypad{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:460px;margin:0 auto}
.kkeypad button{height:56px;border-radius:12px;background:#fff;
  border:2px solid var(--line);font-size:24px;font-weight:800;cursor:pointer;color:var(--ink);
  font-family:inherit}
.kkeypad button:active{background:#f0e6cc}
.kkeypad .kdel{background:#ffe6de;border-color:#f3b6a3;font-size:18px}
.kslot{background:#fff;border:3px dashed var(--steel2);border-radius:14px;min-height:78px;
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  font-size:46px;font-weight:900;letter-spacing:6px;color:var(--steel2);
  font-variant-numeric:tabular-nums}
.kslot .kph{font-size:17px;letter-spacing:0;color:#b8a887;font-weight:600}
.kseq{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.knode{flex:0 0 auto;width:104px;height:66px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:25px;font-weight:900;background:#fff;
  border:3px solid var(--line);color:var(--steel2);font-variant-numeric:tabular-nums}
.knode input{width:100%;height:100%;border:none;background:transparent;text-align:center;
  font-size:25px;font-weight:900;color:var(--no);font-family:inherit;outline:none}
.knode.kblank{border-color:var(--no);border-style:dashed}
.karrow{color:#b8a887;font-size:20px;font-weight:900}
@media (max-width:560px){
  .kcol{width:74px}
  .knode{width:86px;height:58px;font-size:21px}
  .kkeypad{grid-template-columns:repeat(5,1fr);gap:7px}
}

/* =====================================================================
   3A 星艦補給線
   ===================================================================== */
.gstory,.gorder,.gchipbox,.gknown{background:#f2f9ff;border:2px dashed #9dc4dd;border-radius:14px;
  padding:12px 16px;font-size:18px;line-height:1.7;color:var(--ink);margin-bottom:14px;font-weight:700;text-align:center}
.gstory{text-align:left}
.gchipbox b,.gorder b,.gknown b{color:var(--amber2);font-size:22px;font-variant-numeric:tabular-nums}
.ghintline{text-align:center;font-size:14.5px;color:#5b6b75;margin-top:12px;line-height:1.7}

/* ----- L1 能量配對 ----- */
.gslots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gslot{border:3px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;
  font-family:inherit;cursor:pointer;transition:.13s;display:flex;flex-direction:column;align-items:center;gap:2px}
button.gslot:hover{border-color:var(--amber);transform:translateY(-3px);box-shadow:0 0 0 4px #d8f2ff}
.gslot .gv{font-size:23px;font-weight:900;color:var(--steel2);font-variant-numeric:tabular-nums}
.gslot small{font-size:11.5px;color:#9aa7b0;font-weight:800}
.gslot.done{background:linear-gradient(#e8fbff,#c9f0ff);border-color:var(--amber2);cursor:default}
.gslot.done .gv{color:var(--amber2)}
.gslot.done small{color:#0f7fa8}

/* ----- L2 貨櫃裝載 ----- */
.gtablewrap{overflow-x:auto}
.gsum{margin:0 auto;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gsum td{width:54px;height:46px;text-align:center;font-size:25px;font-weight:900;color:var(--steel2);
  border-bottom:2px dotted #d5e4ef}
.gsum .glab{width:auto;min-width:112px;font-size:13px;font-weight:800;color:#8b9aa5;text-align:right;
  padding-right:10px;border-bottom:0}
.gsum .ghead td{font-size:13.5px;color:#8b9aa5;height:26px;font-weight:800;border-bottom:2px solid var(--steel2)}
.gsum .glayer td{color:#2b6c8c;animation:pop3 .25s ease-out}
.gsum .gtotal td{border-top:4px solid var(--steel2);border-bottom:0;color:#14683f;font-size:28px}
.gdigits{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.gdigit{border:3px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-family:inherit;
  cursor:pointer;transition:.13s;min-width:92px}
.gdigit:hover{border-color:var(--amber);transform:translateY(-2px)}
.gdigit.on{border-color:var(--amber2);box-shadow:0 0 0 4px #d8f2ff}
.gdigit .gdl{display:block;font-size:12.5px;font-weight:800;color:#8b9aa5}
.gdigit b{font-size:26px;color:var(--steel2);font-variant-numeric:tabular-nums}
.gask{text-align:center;font-size:17px;font-weight:800;color:#0f5a78;margin:12px 0 8px;line-height:1.7}
.gask b{font-size:23px;color:var(--amber2)}
.gask.done{color:#14683f;background:#e6f7ee;border:2px solid var(--ok);border-radius:12px;padding:10px}
.gask.done b{font-size:26px;color:#14683f}
.gcols{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:430px;margin:0 auto}
.gcol{border:3px solid var(--line);background:#fff;border-radius:12px;padding:11px 0;font-family:inherit;
  font-size:17px;font-weight:900;color:var(--steel2);cursor:pointer;transition:.13s}
.gcol:hover{border-color:var(--amber);transform:translateY(-2px)}

/* ----- L3 出貨輸送帶 ----- */
.gbelt{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:14px 4px;
  background:linear-gradient(#e9eff4,#d7e2ea);border-radius:14px;border:2px solid #c2d2dd}
.ggap{flex:0 0 auto;width:46px;border:2px dashed #93b4c8;background:#fff;border-radius:10px;
  font-size:11.5px;font-weight:800;color:#5b8aa5;cursor:pointer;font-family:inherit;line-height:1.35;padding:4px 2px}
.ggap:hover{background:#d8f2ff;border-color:var(--amber2);border-style:solid}
.gbox{flex:0 0 auto;min-width:104px;border:3px solid #8a6a3a;border-radius:10px;
  background:linear-gradient(#f3ecdc,#dccfb2);padding:10px 8px;text-align:center}
.gbox small{display:block;font-size:12px;font-weight:800;color:#6b5720}
.gbox b{font-size:23px;color:var(--steel2);font-variant-numeric:tabular-nums}
.gbox.isnew{border-color:var(--ok);background:linear-gradient(#e6f7ee,#bfe8cf);animation:pop3 .3s ease-out}

/* ----- L4 貨單解碼 ----- */
.gdial{max-width:340px;margin:0 auto;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px}
.gdialrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gstep{border:2px solid var(--line);background:#f2f9ff;border-radius:10px;padding:9px 0;font-family:inherit;
  font-size:16px;font-weight:900;color:var(--steel2);cursor:pointer;transition:.12s}
.gstep:hover{border-color:var(--amber);background:#d8f2ff}
.gval{text-align:center;font-size:40px;font-weight:900;color:var(--amber2);margin:8px 0;
  font-variant-numeric:tabular-nums}
.gbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.ghist{max-width:420px;margin:10px auto 0;display:flex;flex-direction:column;gap:6px}
.gh{border-radius:10px;padding:8px 12px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.gh.big{background:#ffeee8;color:#8f3418}
.gh.small{background:#eef4ff;color:#27417a}
.gh.same{background:#e6f7ee;color:#14683f}

@media (max-width:560px){
  .gslots{grid-template-columns:repeat(3,1fr)}
  .gsum td{width:40px;height:40px;font-size:21px}
  .gsum .glab{min-width:88px;font-size:11.5px}
  .gstory,.gorder,.gchipbox,.gknown{font-size:16.5px}
}

/* =====================================================================
   關卡導引（進關卡前的說明）與 求救 SOS —— 所有單元共用
   ===================================================================== */
.demohead{text-align:center;margin:10px 0 16px}
.demoemoji{font-size:44px;line-height:1}
.demohead h2{font-size:24px;color:var(--steel2);margin:6px 0 4px}
.demohead p{font-size:16.5px;color:#5b6b75;line-height:1.75;max-width:620px;margin:0 auto}
.demoex{background:#fffdf6;border:2px dashed #cdb88a;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.demoex h4{font-size:15px;color:#8f6a18;margin-bottom:8px}
.demoex .exrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  font-size:19px;font-weight:800;color:var(--steel2);line-height:1.9;font-variant-numeric:tabular-nums}
.demoex .exbox{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 12px}
.demoex .exarrow{color:var(--amber2);font-weight:900}
.demoex .exnote{font-size:14.5px;color:#6b7b85;text-align:center;margin-top:8px;line-height:1.7}
.demosteps{display:flex;flex-direction:column;gap:10px}
.dstep{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:12px 14px}
.dstep .dnum{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--amber);
  color:#3b2a00;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px}
.dstep b{font-size:16.5px;color:var(--steel2)}
.dstep .dsd{font-size:15px;color:#5b6b75;line-height:1.75;margin-top:3px}
.demonote{margin-top:14px;background:#fff6e2;border:2px solid var(--amber);border-radius:12px;
  padding:11px 14px;font-size:15px;color:#6b5720;line-height:1.75}

.sosbox{margin-top:12px;background:#f3f8ff;border:2px solid #9fc0e8;border-radius:14px;padding:12px 14px}
.sosbox h4{font-size:15px;color:#27417a;margin-bottom:8px}
.sosline{display:flex;gap:10px;align-items:flex-start;margin-bottom:7px;font-size:15.5px;
  color:var(--ink);line-height:1.75}
.sosline .sn{flex:0 0 auto;width:23px;height:23px;border-radius:50%;background:#dbe8fb;color:#27417a;
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sosmore{font-size:14px;color:#6b7b85;margin-top:6px}
.sosmore.done{color:#8f3418;font-weight:800}
@media (max-width:560px){
  .demohead h2{font-size:21px}
  .demohead p,.dstep .dsd{font-size:14.5px}
  .demoex .exrow{font-size:17px}
}

/* =====================================================================
   4A 精密工坊
   ===================================================================== */
.wstory{background:#fffdf5;border:2px dashed #d6c49a;border-radius:14px;padding:12px 16px;
  font-size:18px;line-height:1.75;color:var(--ink);margin-bottom:14px;font-weight:700;text-align:center}
.wstory b{color:var(--amber2);font-size:23px;font-variant-numeric:tabular-nums}
.wask{text-align:center;font-size:17px;font-weight:800;color:#7a4a12;margin:14px 0 9px;line-height:1.7}
.wask b{color:var(--amber2);font-size:21px}
.whint{text-align:center;font-size:14.5px;color:#6b7b85;margin-top:10px}
.wopts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.wopt{border:3px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-family:inherit;
  font-size:17px;font-weight:900;color:var(--steel2);cursor:pointer;transition:.13s;font-variant-numeric:tabular-nums}
.wopt:hover:not(:disabled){border-color:var(--amber);transform:translateY(-2px)}
.wopt:disabled{opacity:.45;cursor:default}
.wopt.on{border-color:var(--amber2);background:#fff3d9;box-shadow:0 0 0 4px #ffe9bb}
.wopt.big{font-size:21px;padding:12px 22px}
.wopt.go{background:linear-gradient(180deg,#2fa46b,#1d7f50);color:#fff;border-color:#1d7f50}

/* L1 跳格 */
.wtrack{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;
  background:linear-gradient(#eef3f8,#dde7f0);border:2px solid #c3d3e0;border-radius:14px;padding:12px 10px;margin:12px 0}
.wship{font-size:28px}
.wjump{width:34px;height:34px;border-radius:50%;background:#fff;border:2px dashed #9db6c9;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#5b7b92;
  animation:pop3 .25s ease-out}

/* 尺 */
.wruler{position:relative;height:96px;background:linear-gradient(#fff6dc,#ffeab8);
  border:3px solid #c9a44f;border-radius:10px;margin:6px 0 4px;overflow:hidden}
.wcmlab{position:absolute;bottom:6px;font-size:13px;font-weight:800;color:#8a6a20}
.wticks{position:absolute;left:0;right:0;top:0;height:46px}
.wticks i{position:absolute;top:0;width:2px;background:#8a6a20;margin-left:-1px}
.wticks .t1{height:12px;opacity:.55}
.wticks .t5{height:20px;opacity:.75}
.wticks .t10{height:30px}
.wseg{position:absolute;left:0;top:52px;height:14px;border-radius:7px;
  background:linear-gradient(#444,#111);box-shadow:0 1px 0 #fff8}
.wobj{position:absolute;top:50px;height:26px;border-radius:7px;
  background:linear-gradient(#6cc6f0,#2f9fd0);border:2px solid #1b7ba8;
  display:flex;align-items:center;justify-content:center;transition:left .12s}
.wobj span{font-size:17px}
.wmove{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.wmv{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-family:inherit;
  font-size:15px;font-weight:900;color:var(--steel2);cursor:pointer}
.wmv:hover{border-color:var(--amber);background:#fff6e2}
.wpos{font-size:15px;font-weight:800;color:var(--amber2);font-variant-numeric:tabular-nums;min-width:120px;text-align:center}

/* L2 放大鏡 */
.wzoom{background:#f3f8ff;border:2px solid #9fc0e8;border-radius:14px;padding:12px;margin:12px 0}
.wzlab{font-size:14.5px;font-weight:800;color:#27417a;margin-bottom:8px;text-align:center}
.wzbar{position:relative;height:52px;background:linear-gradient(#fff6dc,#ffeab8);
  border:2px solid #c9a44f;border-radius:8px}
.wzbar i{position:absolute;top:0;width:2px;height:22px;background:#8a6a20;margin-left:-1px}
.wzseg{position:absolute;left:0;top:28px;height:14px;border-radius:7px;background:linear-gradient(#444,#111)}
.wzmarks{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:#5b6b75;margin-top:3px}

/* L3 分類櫃 */
.wbins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wbin{border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 6px;font-family:inherit;
  cursor:pointer;transition:.13s;display:flex;flex-direction:column;align-items:center;gap:4px}
.wbin:hover:not(:disabled){border-color:var(--amber);transform:translateY(-3px);box-shadow:0 0 0 4px #ffe9bb}
.wbin:disabled{opacity:.5;cursor:default}
.wbin .wbi{font-size:30px;line-height:1}
.wbin b{font-size:20px;color:var(--steel2)}

<body>

<script>
/* ============================================================
   國小數學互動遊戲　共用引擎  game-engine.js
   ------------------------------------------------------------
   單元包（units/unit-X-Y.js）必須先定義：
     UNIT        單元設定（見 units/unit-1-2.js 的註解）
     MIS         迷思代碼字典
     LEVELS      四個關卡
     MODES       玩法登錄表 { 模式名: {sub,title,stage,bind,judge,answer,onRight,choice} }
   然後呼叫 GameEngine.start()。
   ============================================================ */


var UNIT_ID, UNIT_SUB;

/* ======================================================================
   ★★★ 全域設定（所有單元共用，改這裡就好）
   ====================================================================== */
var SHEET_API = 'https://script.google.com/macros/s/AKfycbymfdR-lDRz3jLf0fYpaDisEXbkYfsdgz3aAItaTxXvG4sR5t4BexdvfK8CmoUBaqIP/exec';
var TEACHER_CODE = '1234';       /* 老師解鎖碼 */
var MIN_CLASS = 3;               /* 全班至少幾人才用相對排名給點數 */
var PENALTY = 3, FREEZE_MS = 10000;  /* 猜得到的題型答錯：扣分＋罰停毫秒（10 秒，擋狂亂猜） */
var SOFT_FREEZE_MS = 3000;           /* 動手操作型答錯：不扣分，只停 3 秒 */
/* 百分制：單元設 UNIT.hundred=true 時，每題配分寫在 it.pt，總分 100。
   一次做對拿滿分、訂正後拿一半、看到答案後才做對不給分；沒有點數、連擊、扣分。 */
var HUNDRED = false;
function fmtPt(n){ n=Math.round((n||0)*100)/100; return String(n); }   /* 2.5 分的一半是 1.25，要留兩位 */
function lvMax(lv){ var m=0; lv.items.forEach(function(it){ m+=(it.pt||0); }); return m; }

/* 12 隻夥伴（所有單元共用） */
var PETS = [
  {f:"🐱",n:"小貓咪"}, {f:"🐶",n:"小狗狗"}, {f:"🐰",n:"小兔子"}, {f:"🐼",n:"小貓熊"},
  {f:"🦊",n:"小狐狸"}, {f:"🐯",n:"小老虎"}, {f:"🐨",n:"無尾熊"}, {f:"🐸",n:"小青蛙"},
  {f:"🐧",n:"小企鵝"}, {f:"🦁",n:"小獅子"}, {f:"🐵",n:"小猴子"}, {f:"🐹",n:"小倉鼠"}
];

/* 位值定義（數與計算類單元共用） */
var PLACES = [
  {k:'th', lab:'千位', unit:'個千', val:1000, cls:'k1000'},
  {k:'h',  lab:'百位', unit:'個百', val:100,  cls:'k100'},
  {k:'t',  lab:'十位', unit:'個十', val:10,   cls:'k10'},
  {k:'o',  lab:'個位', unit:'個一', val:1,    cls:'k1'}
];
/* ===================== 共用：狀態 ===================== */
var app=document.getElementById('app'), scoreChip=document.getElementById('scoreChip'),
    timeChip=document.getElementById('timeChip'), petChip=document.getElementById('petChip'),
    sndChip=document.getElementById('sndChip'), rankChip=document.getElementById('rankChip');

var S = { score:0, stars:{}, unlocked:1, animal:null, name:'', records:{}, finalized:false };

/* 老師解鎖碼：學生送出成績後畫面會鎖住，要重玩得由老師輸入這組數字 */
var TEACHER_CODE = '1234';
/* 存檔在 start() 裡讀，因為那時 UNIT 才存在 */
function save(){ try{ localStorage.setItem('save-'+UNIT.id, JSON.stringify(S)); }catch(e){} }

var DEV = (function(){
  var k='math3-dev', v='';
  try{ v=localStorage.getItem(k)||''; }catch(e){}
  if(!v){ v='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
          try{ localStorage.setItem(k,v); }catch(e){} }
  return v;
})();
var UID = '';   /* start() 時才組出來：裝置碼_單元代號_座位序號 */

/* 同一台電腦輪流玩時，用座位序號把每個學生分開，才不會互相覆蓋 */
function seatNo_(){
  try{ return parseInt(localStorage.getItem('seat-'+UNIT.id)||'0',10)||0; }catch(e){ return SEAT_MEM; }
}
var SEAT_MEM = 0;
function nextSeat_(){
  var v = seatNo_() + 1;
  SEAT_MEM = v;
  try{ localStorage.setItem('seat-'+UNIT.id, String(v)); }catch(e){}
  return v;
}
function makeUID(){
  var seat = seatNo_();
  return DEV + '_' + UNIT_ID + (seat ? '_s'+seat : '');
}
/* 換下一位同學：清空這一輪的成績，換一個新的身分 */
function switchStudent(){
  nextSeat_();
  S = { score:0, stars:{}, unlocked:1, animal:null, name:'', records:{}, finalized:false };
  UID = makeUID();
  RANK_SNAP = null; LAST_CHASE = '';
  save();
  paintScore(); paintRank();
  renderPick();
}

var SND = true;
try{ SND = localStorage.getItem('math3-snd')!=='0'; }catch(e){}
function paintSnd(){ sndChip.textContent = SND?'🔊':'🔇'; }
sndChip.onclick=function(){
  SND=!SND;
  try{ localStorage.setItem('math3-snd',SND?'1':'0'); }catch(e){}
  paintSnd();
  if(SND){ sTap(); say('聲音打開了'); }
  else { try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
};
paintSnd();

/* 右上角的 ⭐ 一律用「排行榜採計的分數」＝ 已記錄的關卡 ＋ 正在玩的這一關，
   才不會出現「畫面 180 分、榜上 170 分」這種對不起來的情況 */
function paintScore(){
  var t;
  try{ t=provisionalSummary().gained; }catch(e){ t=S.score; }
  scoreChip.textContent = HUNDRED ? ('⭐ '+fmtPt(t)+' / 100') : ('⭐ '+t);
}
function pet(){ return PETS[S.animal]||PETS[0]; }
function paintPet(){
  if(S.animal===null){ petChip.style.display='none'; return; }
  petChip.style.display='';
  petChip.innerHTML='<span class="pet-mini"><span class="face">'+pet().f+'</span>'+pet().n+'</span>';
}
function fmt(s){ var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pctText(x){ return Math.round(x*100)+'%'; }

var G=null, timer=null;

/* ===================== 音效層 ===================== */
var AC=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(freq,dur,type,vol,delay,slideTo){
  if(!SND) return;
  var a=ac(); if(!a) return;
  try{
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(vol||.15,t0);
    g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}
function noise(dur,vol,from,to){
  if(!SND) return;
  var a=ac(); if(!a) return;
  try{
    var n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var src=a.createBufferSource(); src.buffer=buf;
    var f=a.createBiquadFilter(); f.type='bandpass';
    f.frequency.setValueAtTime(from||1200,a.currentTime);
    f.frequency.exponentialRampToValueAtTime(to||400,a.currentTime+dur);
    var g=a.createGain(); g.gain.setValueAtTime(vol||.12,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }catch(e){}
}
function sTap(){ tone(520,.05,'triangle',.10); }
function sPick(){ tone(760,.06,'triangle',.11); }
function sDrop(){ tone(300,.09,'sine',.16,0,180); noise(.09,.06,900,300); }
function sWrong(){ tone(190,.26,'square',.13); tone(140,.3,'square',.1,.05); }
function sRight(){ tone(660,.1,'sine',.14); tone(880,.1,'sine',.13,.09); tone(1180,.18,'sine',.12,.18); }
function sCombo(n){ var b=520; for(var i=0;i<Math.min(n,5);i++) tone(b*Math.pow(1.16,i),.09,'triangle',.12,i*.06); }
function sBreak(){ noise(.42,.16,2600,300); tone(420,.34,'sawtooth',.07,0,150); }
function sMerge(){ tone(430,.1,'sine',.13,0,880); tone(1050,.16,'sine',.11,.1); }
function sClear(){ [523,659,784,1046,1318].forEach(function(f,i){ tone(f,.22,'triangle',.13,i*.11); }); }
function sStar(){ [880,1174,1568].forEach(function(f,i){ tone(f,.2,'sine',.12,i*.09); }); }
function sTick(){ tone(1000,.03,'square',.07); }

/* ===================== 光效層：彩帶／粒子 ===================== */
var fxc=document.getElementById('fx'), fxx=fxc.getContext('2d'), parts=[], fxRun=false;
function fxResize(){ fxc.width=innerWidth; fxc.height=innerHeight; }
addEventListener('resize',fxResize); fxResize();
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function burst(x,y,colors,count,spread){
  if(REDUCED) return;
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2, sp=(spread||6)*(0.35+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:.22,
      c:colors[(Math.random()*colors.length)|0], s:4+Math.random()*6,
      life:52+Math.random()*26, rot:Math.random()*6, vr:(Math.random()-.5)*.4});
  }
  runFX();
}
function confetti(){
  if(REDUCED) return;
  var cols=['#ffb020','#e07b00','#2fa46b','#3aa6e0','#e0603c','#fff'];
  for(var i=0;i<130;i++){
    parts.push({x:Math.random()*fxc.width, y:-20-Math.random()*220,
      vx:(Math.random()-.5)*2.4, vy:2+Math.random()*3.4, g:.045,
      c:cols[(Math.random()*cols.length)|0], s:5+Math.random()*7,
      life:200+Math.random()*90, rot:Math.random()*6, vr:(Math.random()-.5)*.32});
  }
  runFX();
}
function burstAt(el,colors,n){
  if(!el) return;
  var r=el.getBoundingClientRect();
  burst(r.left+r.width/2, r.top+r.height/2, colors||['#ffb020','#fff','#e07b00'], n||26, 6);
}
function runFX(){
  if(fxRun) return; fxRun=true;
  var step=function(){
    fxx.clearRect(0,0,fxc.width,fxc.height);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr; p.life--;
      if(p.life<=0 || p.y>fxc.height+60){ parts.splice(i,1); continue; }
      fxx.save(); fxx.translate(p.x,p.y); fxx.rotate(p.rot);
      fxx.fillStyle=p.c; fxx.globalAlpha=Math.min(1,p.life/26);
      fxx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); fxx.restore();
    }
    if(parts.length) requestAnimationFrame(step);
    else { fxx.clearRect(0,0,fxc.width,fxc.height); fxRun=false; }
  };
  requestAnimationFrame(step);
}
function flash(kind){

/* ===================== 點數機制（與 1-1 相同） ===================== */
var CURVE_EXP=2.5, FAST_RATIO=0.7, MULT_FLOOR=0.6, NEED_3=0.930, NEED_2=0.758;
function levelPerf(firstTry,total,sec,target,timeUp){
  var acc=total?firstTry/total:0;
  var fast=Math.round(target*FAST_RATIO);
  var spd=timeUp?0:Math.min(1,fast/Math.max(sec,1));
  var mult=MULT_FLOOR+(1-MULT_FLOOR)*spd;
  return {acc:acc,spd:spd,mult:mult,fast:fast,perf:acc*mult};
}
function curvePoints(perf){
  var raw=3*Math.pow(perf,CURVE_EXP), pts=Math.round(raw);
  if(pts<1)pts=1; if(pts>3)pts=3;
  return {raw:raw,pts:pts};
}

var DB=null, DBmode='local', BOARD_OFF=null, CLOUD_ERR=false;

var CLOUD_BUSY=false, CLOUD_PENDING=null, CLOUD_CB=null;
function cloudPush(rec,cb){
  if(!SHEET_API){ if(cb) cb(); return; }
  if(CLOUD_BUSY){ CLOUD_PENDING=rec; CLOUD_CB=cb; return; }
  CLOUD_BUSY=true;
  var done=function(ok){
    CLOUD_ERR=!ok; CLOUD_BUSY=false;
    if(CLOUD_PENDING){ var r=CLOUD_PENDING, c=CLOUD_CB; CLOUD_PENDING=null; CLOUD_CB=null; cloudPush(r,c); }
    else if(cb) cb();
  };
  try{
    fetch(SHEET_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(rec)}).then(function(){done(true);}).catch(function(){done(false);});
  }catch(e){ done(false); }
}
function cloudList(cb){

function mySummary(){

    done++; secs+=r.sec; gained+=r.gained; ft+=r.firstTry; tot+=r.total; perfSum+=r.perf;
  });
  var perf=done?perfSum/done:0;
  return { uid:UID, unit:UNIT_ID, fin:(S.finalized?1:0), name:(S.name||UNIT.roleAnon),
           pet:(S.animal===null?0:S.animal), done:done, secs:secs, gained:gained,
           ft:ft, tot:tot, perf:perf, pts:(done?curvePoints(perf).pts:0), ts:Date.now() };
}
var MEMBOARD=[];

/* ---------- 隨時看得到自己在排行榜的位置 ---------- */
var RANK_IV=null;

function startRankPoll(){

function sameUnit(r){ return r && (r.unit===UNIT_ID); }
/* 只輸入名字、一關都還沒完成（也沒交卷）的人不算進排名：
   不然全班都是 0 分時，排在前面的人會平白拿到 3 點，也會亂播「被超過了」 */
function rankable(r){ return r && ((r.done||0)>0 || !!r.fin); }
/* 同一個名字只留一列：學校電腦重開機被還原、或學生換到別台電腦，都會產生新的 uid。
   留自己這台的那一列；都不是自己就留分數高的（同分留比較新的）。沒寫名字的不合併。 */
function dedupeByName(list){
  var keep={}, out=[];
  list.forEach(function(r){
    var k=String(r.name||'').trim();
    if(!k || k===UNIT.roleAnon){ out.push(r); return; }
    var o=keep[k];
    if(!o){ keep[k]=r; return; }
    var better = (r.uid===UID) ? true : (o.uid===UID) ? false
               : (r.gained!==o.gained ? r.gained>o.gained : (r.ts||0)>(o.ts||0));
    if(better) keep[k]=r;
  });
  for(var k in keep) out.push(keep[k]);
  return out;
}

/* 排行榜排序 ＝ 得分高的在前，同分則用時短的在前 */
function rankSort(a,b){
  if(b.gained!==a.gained) return b.gained-a.gained;
  return a.secs-b.secs;
}

/* ---------- 點數改成看班上的相對名次 ----------
   前 1/3 → 3 點、中間 1/3 → 2 點、後 1/3 → 1 點。
   班上不到 3 人時沒有比較基準，改用絕對標準（曲線）估算。 */
var CLASS_LIST=[];
function classList(){
  var l=(CLASS_LIST&&CLASS_LIST.length)?CLASS_LIST:localBoard();
  var myName=String(S.name||'').trim();
  return dedupeByName(l.filter(function(x){
    if(!(x&&typeof x.gained==='number'&&sameUnit(x)&&rankable(x))) return false;
    /* 跟我同名、但不是這台電腦的舊紀錄：呼叫端會放進「現在的我」，舊的那列不要再算一次 */
    if(myName && x.uid!==UID && String(x.name||'').trim()===myName) return false;
    return true;
  }));
}
function refreshClass(cb){
  if(DB){
    try{
      DB.collection('scores').get().then(function(snap){
        CLASS_LIST=snap.docs.map(function(d){return d.data();})
                            .filter(function(x){return x&&typeof x.gained==='number';});
        if(cb) cb();
      }).catch(function(){ if(cb) cb(); });
      return;
    }catch(e){}
  }
  if(DBmode==='cloud'){
    cloudList(function(l){
      if(l) CLASS_LIST=l.filter(function(x){return x&&typeof x.gained==='number';});
      if(cb) cb();
    });
    return;
  }
  CLASS_LIST=localBoard();
  if(cb) cb();
}
function ptsByRank(idx,total){
  if(total<MIN_CLASS) return null;
  var pct = total>1 ? idx/(total-1) : 0;
  return pct<=1/3 ? 3 : (pct<=2/3 ? 2 : 1);
}
/* 把「現在的我」放進全班名單裡排一次 */
function myRankNow(me){
  var list=classList().filter(function(r){ return r.uid!==me.uid; }).concat([me]);
  list.sort(rankSort);
  var idx=0;
  for(var i=0;i<list.length;i++){ if(list[i].uid===me.uid){ idx=i; break; } }
  return { rank:idx+1, n:list.length, pts:ptsByRank(idx,list.length) };
}
/* 含「正在玩、還沒記錄的這一關」的暫定總成績 */
/* 跟排行榜同一套標準：得分高的比較好，同分比用時短 */
function betterRun(gained,sec,old){
  return gained>old.gained || (gained===old.gained && sec<old.sec);
}
function provisionalSummary(){
  var m=mySummary();
  if(G){
    var old=S.records[G.lv.id];
    /* 重玩：結算時只留比較好的那次，所以還沒超過舊紀錄前，分數維持舊紀錄，不會往下掉 */
    if(old && !betterRun(G.gained,G.sec,old)) return m;
    if(old){ m.gained-=old.gained; m.secs-=old.sec; }
    m.gained+=G.gained; m.secs+=G.sec;
    if(!old) m.done+=1;
  }
  return m;
}
/* ============================================================
   名次播報：偵測排行榜的名次變動，唸出來並在畫面上標記
   ============================================================ */
var RANK_SNAP=null, RANK_DELTA={}, VOICE=null, VOICE_READY=false, LAST_SAY=0, LAST_CHASE='';

function pickVoice(){
  if(VOICE_READY) return VOICE;
  try{
    var vs=window.speechSynthesis?speechSynthesis.getVoices():[];
    if(!vs || !vs.length) return null;      /* 語音清單還沒載好，下次再試 */
    for(var i=0;i<vs.length;i++){
      if(/zh[-_]TW|cmn-Hant|Hanhan|Yating|Zhiwei/i.test(vs[i].lang+' '+vs[i].name)){ VOICE=vs[i]; break; }
    }
    if(!VOICE){
      for(var j=0;j<vs.length;j++){
        if(/^zh/i.test(vs[j].lang)){ VOICE=vs[j]; break; }
      }
    }
    VOICE_READY=true;
  }catch(e){}
  return VOICE;
}
try{
  if(window.speechSynthesis){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged=function(){ VOICE_READY=false; pickVoice(); };
  }
}catch(e){}

/* 唸出一句話（跟音效共用同一個開關）
   queue=true 表示接在上一句後面唸，不要蓋掉它
   ------------------------------------------------------------------
   瀏覽器語音有兩個常見的坑，都在這裡處理掉：
   1. cancel() 之後馬上 speak()，Chrome 會靜靜地不發聲 → 隔一個 tick 再送
   2. 閒置久了語音引擎會被暫停 → 每次先 resume()
   另外送出後檢查有沒有真的在唸，沒有就不指定語音再試一次。 */
var SAY_Q=[], SAY_BUSY=false, SAY_FAIL=0;
function ssyn(){ return window.speechSynthesis || null; }
/* 學生用班級座號登入（例如 30301），語音會唸成「三萬零三百零一」。
   名字裡連續 3 位以上的數字要改成一個一個唸；1～2 位（座號 12 號）維持自然唸法。
   只改「唸出來的字串」，畫面上顯示的名字不變。 */
var SAY_DIGIT='零一二三四五六七八九';
function speakName(n){
  return String(n==null?'':n).replace(/[0-9]{3,}/g, function(m){
    return m.split('').map(function(d){ return SAY_DIGIT.charAt(+d); }).join('、');
  });
}
function say(text, queue, names){
  if(!SND || !text) return;
  if(names && names.length){
    names.forEach(function(n){
      /* 只換「第一次出現」的名字：名字都在句首，後面的數字是分數、關卡數，不能動 */
      if(!n || !/[0-9]{3,}/.test(n)) return;
      var i=text.indexOf(n);
      if(i>=0) text = text.slice(0,i) + speakName(n) + text.slice(i+n.length);
    });
  }
  var ss=ssyn(); if(!ss) return;
  if(!queue){
    SAY_Q.length=0; SAY_BUSY=false;
    try{ if(ss.speaking || ss.pending) ss.cancel(); }catch(e){}
  }
  SAY_Q.push(text);
  if(SAY_Q.length>3) SAY_Q.splice(0, SAY_Q.length-3);
  setTimeout(speakNext, 0);         /* 讓 cancel() 先結束，再開始唸 */
}
function utter(t, useVoice){
  var u=new SpeechSynthesisUtterance(t);
  u.lang='zh-TW'; u.rate=1.05; u.pitch=1.12; u.volume=1;
  if(useVoice){ var v=pickVoice(); if(v) u.voice=v; }
  u.onend=function(){ SAY_BUSY=false; SAY_FAIL=0; speakNext(); };
  u.onerror=function(){ SAY_BUSY=false; speakNext(); };
  return u;
}
function speakNext(){
  if(SAY_BUSY || !SAY_Q.length) return;
  var ss=ssyn(); if(!ss){ SAY_Q.length=0; return; }
  var t=SAY_Q.shift();
  SAY_BUSY=true;
  try{
    try{ ss.resume(); }catch(e){}
    ss.speak(utter(t,true));
    /* 送出後確認真的有在唸，沒有就不指定語音再送一次 */
    setTimeout(function(){
      try{
        if(SAY_BUSY && !ss.speaking && !ss.pending){
          SAY_FAIL++;
          ss.speak(utter(t,false));
        }
      }catch(e){}
    },300);
    /* 保險：8 秒還卡著就放行，免得整條佇列死掉 */
    setTimeout(function(){ if(SAY_BUSY){ SAY_BUSY=false; speakNext(); } },8000);
  }catch(e){ SAY_BUSY=false; }
}
/* 這台裝置到底能不能唸？給試聽鍵回報用 */
function voiceReport(){
  var ss=ssyn();
  if(!ss) return {ok:false, msg:'這個瀏覽器不支援語音播報（請改用 Chrome 或 Edge）'};
  var vs=[]; try{ vs=ss.getVoices()||[]; }catch(e){}
  var zh=vs.filter(function(v){ return /^zh/i.test(v.lang); });
  return { ok:true, total:vs.length, zh:zh.length,
           name: zh.length? zh[0].name : (vs.length? vs[0].name : '（沒有語音）'),
           speaking: !!(ss.speaking||ss.pending) };
}

/* 試聽：唸一段範例播報，上課前可以先確認喇叭和語音正常 */
var DEMO_LINES=[
